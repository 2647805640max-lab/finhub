name: FinHub UI v6 smoke checks
on:
  push:
    paths:
      - "index.html"
      - "board.html"
      - "ui-v6.css"
      - "tests/ui-v6-smoke.py"
      - ".github/workflows/ui-v6-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "board.html"
      - "ui-v6.css"
      - "tests/ui-v6-smoke.py"
      - ".github/workflows/ui-v6-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run presentation and contract smoke tests
        run: python tests/ui-v6-smoke.py -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for page in ("index.html", "board.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", html, flags=re.I)
              for number, source in enumerate(scripts):
                  if not source.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as handle:
                      handle.write(source)
                      handle.flush()
                      subprocess.run(["node", "--check", handle.name], check=True)
          PY
