<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>治理看板 · IPS / 因子 / 新闻 / 推演</title>
<style>
/* FinHub board.html · 安卓手机优先 UI（依 docs/04-UI重构规范.md）
   token 与 index.html 同构（37 条，值逐字一致）；断点 430/767/1024 四档 */
:root{
--bg:#0a0e14;--card:#121820;--card2:#18202b;--line:#1f2a37;--txt:#e6edf3;--dim:#7d8b9c;
--up:#f6465d;--dn:#0ecb81;--acc:#4c8dff;--warn:#f5a524;--ok:#0ecb81;
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
--fs-xs:11px;--fs-sm:13px;--fs-md:15px;--fs-lg:17px;--fs-xl:20px;--fs-2xl:24px;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
--sh-1:0 1px 2px rgba(0,0,0,.4);--sh-2:0 4px 16px rgba(0,0,0,.45);
--t-fast:120ms;--t-med:240ms;--tap:44px;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
--pad-x:16px;--maxw:1120px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
font-size:var(--fs-md);line-height:1.6;-webkit-tap-highlight-color:transparent;
overscroll-behavior-y:contain;min-height:100vh;min-height:100dvh;
padding:0 0 calc(var(--tap) + var(--safe-b) + var(--sp-4))}
button,a,[role=button]{touch-action:manipulation}
button{font-family:inherit;font-size:var(--fs-sm);min-width:var(--tap);min-height:var(--tap);
border-radius:var(--r-sm);cursor:pointer;
transition:transform var(--t-fast),background var(--t-fast),border-color var(--t-fast)}
input,textarea,select{font-family:inherit;font-size:16px;min-width:var(--tap);min-height:var(--tap)}
a{min-height:var(--tap);color:var(--acc);display:inline-flex;align-items:center}
header{position:sticky;top:0;z-index:100;background:var(--bg);
padding:calc(var(--sp-2) + var(--safe-t)) var(--pad-x) var(--sp-2);box-shadow:var(--sh-2)}
h1{font-size:var(--fs-2xl);margin:0;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
h1 small{font-weight:400;color:var(--dim);font-size:var(--fs-xs)}
.meta{color:var(--dim);font-size:var(--fs-sm);margin-top:var(--sp-1);overflow-wrap:anywhere}
nav{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-3) var(--pad-x) var(--sp-1)}
nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
padding:0 var(--sp-3);border-radius:var(--r-pill);font-weight:600;white-space:nowrap;
display:inline-flex;align-items:center;justify-content:center}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
main{padding:var(--sp-2) var(--pad-x) var(--sp-4)}
.card{overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);
border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-3);box-shadow:var(--sh-1)}
.card h2{font-size:var(--fs-lg);margin:0 0 var(--sp-2);display:flex;justify-content:space-between;
align-items:center;gap:var(--sp-2);font-weight:600}
.tag{font-size:var(--fs-xs);padding:2px var(--sp-2);border-radius:var(--r-pill);
background:var(--card2);color:var(--dim);white-space:nowrap}
/* 顶部双口径区（F-22）：信号卡口径在前、台账口径在后，同级并排、互不覆盖 */
.dual{display:grid;grid-template-columns:1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.dual>.card{margin-bottom:0;border-top-width:2px}
.cal-sig{border-top-color:var(--acc)}
.cal-led{border-top-color:var(--dim)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--up)}.dim{color:var(--dim)}
.xs{font-size:var(--fs-xs)}.sm{font-size:var(--fs-sm)}.md{font-size:var(--fs-md)}
.note{font-size:var(--fs-xs);color:var(--dim);line-height:1.5}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mt2{margin-top:var(--sp-2)}
.quote{border-left:2px solid var(--line);padding-left:var(--sp-3);margin-bottom:var(--sp-3)}
.pre{white-space:pre-wrap}
.pill{display:inline-block;font-size:var(--fs-xs);padding:1px var(--sp-1);border-radius:var(--r-sm);
border:1px solid var(--line);color:var(--dim);margin-right:var(--sp-1)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--up);border-color:var(--up)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:var(--sp-2) var(--sp-3);font-size:var(--fs-sm)}
.kv div:nth-child(odd){color:var(--dim)}
.kv b{font-variant-numeric:tabular-nums}
.hops{border-left:2px solid var(--line);margin-left:var(--sp-2);padding-left:var(--sp-3)}
.hop{margin-bottom:var(--sp-3);position:relative}
.hop::before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;
border-radius:50%;background:var(--acc)}
.hop b{font-size:var(--fs-sm)}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:var(--sp-1)}
.bar>i{display:block;height:100%;background:var(--acc)}
.err{color:var(--up);font-size:var(--fs-xs)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th,td{text-align:left;padding:var(--sp-2) 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:var(--fs-xs)}
.freshbar{margin:0 0 var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
border:1px solid var(--line);border-left:3px solid transparent;background:var(--card2);
font-size:var(--fs-sm);line-height:1.5;min-height:36px}
.freshbar.ok{border-left-color:var(--ok);color:var(--txt)}
.freshbar.warn{border-left-color:var(--warn);color:var(--warn)}
.freshbar.bad{border-left-color:var(--up);color:var(--up)}
.installbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;background:var(--card2);
border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3);margin-bottom:var(--sp-3);
font-size:var(--fs-sm)}
.installbar button{background:var(--acc);border:0;color:var(--bg);font-weight:600;
padding:0 var(--sp-4);font-size:var(--fs-sm)}
.installbar button:disabled{background:var(--line);color:var(--dim);cursor:default}
footer{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg);
border-top:1px solid var(--line);padding:var(--sp-2) var(--pad-x);
padding-bottom:calc(var(--safe-b) + var(--sp-2));font-size:var(--fs-xs);color:var(--dim);
display:flex;gap:var(--sp-2);justify-content:space-between;align-items:center;flex-wrap:wrap}
footer span{overflow-wrap:anywhere;min-width:0}
button.reload{background:none;border:1px solid var(--line);color:var(--dim);border-radius:var(--r-sm);
padding:0 var(--sp-3);font-size:var(--fs-sm)}
button:active,a:active,[role=button]:active{transform:scale(.98);background:var(--card2);
transition:transform var(--t-fast),background var(--t-fast)}
nav button.on:active{background:var(--acc)}
/* 断点一：手机 ≤430px（小米 14 = 393×873，DPR 3） */
@media (max-width:430px){
header{padding-left:var(--sp-3);padding-right:var(--sp-3)}
nav{padding:var(--sp-2) var(--sp-3) var(--sp-1);gap:var(--sp-1)}
nav button{padding:0 var(--sp-2);font-size:var(--fs-xs)}
main{padding:var(--sp-2) var(--sp-3) var(--sp-4)}
.kv{grid-template-columns:88px 1fr}}
/* 断点二：大手机 / 小平板 431–767px */
@media (min-width:431px) and (max-width:767px){
header{padding-left:var(--sp-5);padding-right:var(--sp-5)}
nav{padding:var(--sp-2) var(--sp-5) var(--sp-1)}
main{padding:var(--sp-2) var(--sp-5) var(--sp-5)}
.card{padding:var(--sp-4)}
.kv{grid-template-columns:120px 1fr}}
/* 断点三：平板 768–1024px（2 列） */
@media (min-width:768px){
main{max-width:var(--maxw);margin:0 auto}
main>section{display:grid;gap:var(--sp-4);align-items:start}
main>section>.card{margin-bottom:0}
main>section>.dual{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}
main>section>.installbar{grid-column:1/-1}
.card{padding:var(--sp-4)}
.card h2{font-size:var(--fs-xl)}
.kv{grid-template-columns:130px 1fr}
.tblwrap{overflow-x:auto}}
@media (min-width:768px) and (max-width:1024px){
main>section{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 断点四：桌面 ≥1025px（3 列） */
@media (min-width:1025px){
main>section{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{padding:var(--sp-6)}
.kv{grid-template-columns:140px 1fr}}
/* 2026-11-06 修复（ui-board 未完成的两处桌面 bug）：
   ① ≥768 时 header/nav/main 必须共用同一个 1120 容器与同一左右内距，
      否则标题贴左(x≈20)而卡片居中(x≈120)，视觉错位（1280 视口实测）。
   ② 首卡（配置偏离）是首要信息，应跨满整行，不该只占 1/3 宽、右侧留白。 */
@media (min-width:768px){
  header,nav{max-width:var(--maxw);margin-left:auto;margin-right:auto;
    padding-left:var(--sp-5);padding-right:var(--sp-5)}
  main{padding-left:var(--sp-5);padding-right:var(--sp-5)}
  #s-today>.card:first-child,#s-today>.dual:first-child,
  #s-ips>.card:first-child,#s-rules>.card:first-child{grid-column:1/-1}
  /* .dual 内部固定 2 列；当两口径只剩一个（today.live 缺失）时，独卡必须占满，
     否则右侧空出半个网格 —— 1280 视口实测 ① 配置偏离卡只占 540px/1080px。 */
  .dual>.card:only-child{grid-column:1/-1}
}
/* 手机档表格卡片化（≤767px，不横向滚动） */
@media (max-width:767px){
.tblwrap table,.tblwrap tbody,.tblwrap tr,.tblwrap td{display:block;width:auto}
.tblwrap thead{display:none}
.tblwrap tr{border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--sp-2);
margin-bottom:var(--sp-2);background:var(--card2)}
.tblwrap td{display:flex;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-1) 0;
min-width:0;overflow-wrap:anywhere}
.tblwrap td::before{content:attr(data-label);color:var(--dim);font-size:var(--fs-xs);flex:0 0 auto}
.tblwrap td:first-child{font-size:var(--fs-md);font-weight:600}
.tblwrap td:first-child::before{content:none}
.tblwrap td.num{text-align:left}}
/* 触摸设备专属：命中区更大 + :active 反馈 */
@media (pointer:coarse){
button,a,[role=button]{min-height:var(--tap);min-width:var(--tap)}
button:active,a:active,[role=button]:active{transform:scale(.98);opacity:.9}}
/* 动效降级 */
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
transition-duration:.01ms !important;scroll-behavior:auto !important}}
</style>
  <link rel="stylesheet" href="ui-v6.css?v=2">
</head>
<body class="fh-v6">
<header>
<div id="freshbar" class="freshbar" hidden></div>
<h1>治理看板 <small id="ver">—</small></h1>
<div class="meta" id="gen">加载中…</div>
</header>

<nav id="tabs">
  <button data-t="today" class="on">今日简报</button>
  <button data-t="ips">配置仪表</button>
  <button data-t="rules">口径与规则</button>
  <button data-t="audit">审计留痕</button>
  <button data-t="nt">国家队</button>
  <button data-t="settings">设置</button>
</nav>

<main>
  <section id="s-today"></section>
  <section id="s-ips" hidden></section>
  <section id="s-rules" hidden></section>
  <section id="s-audit" hidden></section>
  <section id="s-nt" hidden></section>
  <section id="s-settings" hidden></section>
</main>

<footer>
  <span id="src">data/board.json</span>
  <button class="reload" onclick="load()">刷新</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kv = (k,v,c) => '<div>'+k+'</div><div'+(c?' class="'+c+'"':'')+'>'+v+'</div>';
function card(title, tag, body, cls){ return `<div class="card${cls?' '+cls:''}"><h2>${esc(title)}<span class="tag">${esc(tag||'')}</span></h2>${body}</div>`; }

// ── IPS 五项 ──
function renderIPS(d){
  const ips = d.ips || {};
  const rows = (ips.items||[]).map(it=>{
    const cls = it.status==='ok'?'ok':(it.status==='gap'?'bad':'warn');
    return `<tr><td data-label="项"><b>${esc(it.name)}</b><div class="dim xs">${esc(it.source||'')}</div></td>
      <td class="num" data-label="值">${esc(it.value==null?'—':it.value)}</td>
      <td class="${cls} xs" data-label="说明 / 来源">${esc(it.note||'')}</td></tr>`;
  }).join('');
  let h = card('IPS 一页速查', ips.asOf||'', `
    <div class="tblwrap"><table><thead><tr><th>项</th><th style="text-align:right">值</th><th>说明 / 来源</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=3 class="err">contracts 未就绪</td></tr>'}</tbody></table></div>
    <div class="note mt2">${esc(ips.footer||'')}</div>`);
  if (ips.alerts && ips.alerts.length){
    h += card('⚠ 当前失效项', String(ips.alerts.length), ips.alerts.map(a=>`<div class="err">· ${esc(a)}</div>`).join(''));
  }
  $('#s-ips').innerHTML = h;
}

// ── 口径与规则（2026-11-04 P1-4）──
function renderRules(d){
  $('#s-rules').innerHTML = renderFactor(d) + renderNews(d) + renderChain(d) + renderWatch(d);
}
// ── 因子登记 ──
function renderFactor(d){
  const f = d.factors || {};
  const sum = f.summary || {};
  const items = f.factors || [];
  const grp = {};
  items.forEach(x=>{ const k=(x.kind==='exposure' ? (x.variant||'exposure') : 'predictive'); grp[k]=(grp[k]||0)+1; });
  let h = card('因子总数（不可相加）', f.asOf||'', '<div class="kv">'
    + kv('暴露·资产类别','<b>'+(grp['asset-class']||0)+'</b> 个')
    + kv('暴露·因果合并','<b>'+(grp['causal-chain']||0)+'</b> 个')
    + kv('预测因子','<b>'+(grp['predictive']||0)+'</b> 个')
    + kv('合计行数',items.length+' 条 <span class="dim">（8+6+11，前两者同源两套口径，不可相加）</span>')
    + kv('说明','<span class="dim">'+esc(sum.note||'三类因子含义不同，不可相加')+'</span>')+'</div>');
  const tbody = items.map(x=>{
    // board.json 里 correlations 可能是数组，也可能是 {}（空对象）；非数组一律当空处理。
    const corrRaw = x.correlations;
    const corrList = Array.isArray(corrRaw) ? corrRaw : [];
    const cs = corrList.filter(c=>c && c.r!=null && Math.abs(Number(c.r))>=0.7);
    const cTxt = cs.length ? cs.map(c=>`${esc(c.with)} ${Number(c.r)>0?'+':''}${Number(c.r).toFixed(3)}`).join(' · ') : '<span class="dim">—</span>';
    return `<tr><td data-label="id"><b>${esc(x.id)}</b><div class="dim xs">${esc(x.label||'')}</div></td>
      <td data-label="类"><span class="pill">${esc(x.kind)}</span></td>
      <td class="xs" data-label="方向 / 频率">${esc(x.direction||'—')}<div class="dim">${esc(x.updateFrequency||'')}</div></td>
      <td class="xs" data-label="|r|≥0.7">${cTxt}</td>
      <td class="xs dim" data-label="失效条件">${esc(x.invalidation||'—')}</td></tr>`;
  }).join('');
  h += card('因子清单', items.length+' 条', `<div class="tblwrap"><table><thead><tr><th>id</th><th>类</th><th>方向/频率</th><th>|r|≥0.7</th><th>失效条件</th></tr></thead>
    <tbody>${tbody||'<tr><td colspan=5 class="err">contracts 未就绪</td></tr>'}</tbody></table></div>`);
  if (f.unknowns && f.unknowns.length){
    h += card('未知项', String(f.unknowns.length), f.unknowns.map(u=>`<div class="dim sm">· ${esc(u)}</div>`).join(''));
  }
  return h;
}

// ── 新闻映射 ──
function renderNews(d){
  const n = d.news || {};
  const evs = n.events || [];
  let h = card('事件映射字典', evs.length+' 类', `<div class="tblwrap"><table><thead><tr><th>事件类型</th><th>受影响因子</th><th>资产影响</th><th>可信度</th></tr></thead><tbody>` +
    (evs.map(e=>`<tr><td data-label="事件类型"><b>${esc(e.eventType)}</b><div class="dim xs">${esc(e.frequency||'')}</div></td>
      <td class="xs" data-label="受影响因子">${(e.affectedFactors||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</td>
      <td class="xs" data-label="资产影响">${(e.assetImpact||[]).map(a=>`${esc(a.asset)}：${esc(a.direction)}/${esc(a.strength)} <span class="dim">${esc(a.lag||'')}</span>`).join('<br>')}</td>
      <td data-label="可信度"><span class="pill ${e.confidence==='A'?'ok':(e.confidence==='C'?'warn':'')}">${esc(e.confidence||'?')}</span></td></tr>`).join('')
      || '<tr><td colspan=4 class="err">contracts 未就绪</td></tr>') + '</tbody></table></div>');
  const wl = n.sourceWhitelist || [];
  if (wl.length) h += card('来源白名单', wl.length+' 源', `<div>${wl.map(s=>`<span class="pill ${s.tier==='A'?'ok':''}">${esc(s.name||s.id)}</span>`).join('')}</div>`);
  return h;
}

// ── 推演规则 ──
function renderChain(d){
  const c = d.chain || {};
  const r = c.rules || {};
  let h = card('链式推演规则', 'chain-rules/v1', '<div class="kv">'
    + kv('跳数上限','<b class="'+(r.maxHops?'ok':'bad')+'">'+esc(r.maxHops==null?'未设':r.maxHops)+'</b> 跳')
    + kv('每跳必填',(r.requiredPerHop||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(''))
    + kv('必须回答',esc(r.mustAnswer||'—'),'warn')
    + kv('是否触发交易',r.mayTriggerTrade?'可以（危险）':'不可以，仅生成假设',r.mayTriggerTrade?'bad':'ok')
    + kv('事后校准',esc(r.calibration||'—'))+'</div>');
  const knownDev = (d.chain && d.chain.knownDeviations) ? d.chain.knownDeviations : (r.knownDeviations||[]);
  if (knownDev && knownDev.length){
    h += card('已知偏离（如实登记）', String(knownDev.length),
      knownDev.map(x=>`<div class="err sm">· ${esc(x.what||x)}<div class="dim">${esc(x.recordedIn||'')}</div></div>`).join(''));
  }
  if (c.example){
    const e = c.example;
    h += card('示例记录', esc(e.recordId||''), (e.hops||[]).map(hp=>`
      <div class="hops"><div class="hop"><b>第 ${esc(hp.hop)} 跳</b> <span class="pill ${(hp.probability>=0.7)?'ok':((hp.probability>=0.4)?'warn':'bad')}">p=${esc(hp.probability)}</span>
      <div>${esc(hp.claim)}</div>
      <div class="bar"><i style="width:${Math.round((hp.probability||0)*100)}%"></i></div>
      <div class="dim xs">观测：${esc(hp.observable)}<br>失效：${esc(hp.invalidation)}</div></div></div>`).join('')
      + (function(c){
      if(c && typeof c==='object'){
        return `<div class="sm mt2">
          <div><b>裁决：</b>${esc(c.verdict||'—')}</div>
          <div class="dim mt2">${esc(c.text||'')}</div>
          ${c.weightEffect?`<div class="mt2"><b>权重影响：</b><span class="dim">${esc(c.weightEffect)}</span></div>`:''}
          ${c.whatWouldChangeIt?`<div class="mt2"><b>什么会推翻它：</b><span class="warn">${esc(c.whatWouldChangeIt)}</span></div>`:''}
        </div>`;
      }

// ── 今日简报（阶段 1 核心）──
function st(v){ return v?'<span class="ok">正常</span>':'<span class="bad">过期</span>'; }
function pct(v){ return v==null?'—':(Number(v).toFixed(2)+'%'); }
function decisionIntegrityFor(board, position){
  var gate=(board&&(board.decisionIntegrity||(board.today&&board.today.decisionIntegrity)))||null;
  var reasons=[];
  if(!gate || gate.status!=='PASS' || gate.canRecommend!==true)
    reasons.push(gate?(gate.message||'上游完整性闸门未通过'):'上游未提供决策完整性 PASS');
  var gateStamp=gate&&gate.checkedAt?Date.parse(gate.checkedAt):NaN;
  if(!Number.isFinite(gateStamp)) reasons.push('完整性审计时点缺失');
  else {
    var gateAgeMs=Date.now()-gateStamp;
    if(gateAgeMs>24*60*60*1000) reasons.push('完整性审计结果超过24小时');
    if(gateAgeMs< -5*60*1000) reasons.push('完整性审计时点位于未来');
  }
  var age=position&&position.dataAgeDays!=null?Number(position.dataAgeDays):NaN;
  if(!Number.isFinite(age)&&position&&position.dataAsOf){
    var stamp=Date.parse(position.dataAsOf);
    if(Number.isFinite(stamp)) age=(Date.now()-stamp)/86400000;
  }
  if(!Number.isFinite(age)) reasons.push('持仓快照年龄缺失');
  else if(age>1.5) reasons.push('持仓快照超过36小时（'+age.toFixed(2)+'天）');
  if(position&&position.stale===true) reasons.push('上游已标记持仓快照过期');
  return {blocked:reasons.length>0,reasons:reasons};
}

//   ① raw.githubusercontent.com（S4 每 30 分钟覆盖）② ./data/board.json 自托管兜底 ③ localStorage 缓存
// 全部失败 → 显示错误 + 「上次成功时间」，绝不显示成 0 或空成功。
const BOARD_SOURCE_RAW   = 'https://raw.githubusercontent.com/2647805640max-lab/finhub-data/main/board.json';
const BOARD_SOURCE_SELF  = './data/board.json';
const BOARD_CACHE_KEY    = 'board.cache.v1';
const BOARD_CACHE_META   = 'board.cache.meta.v1';

function readCache(){
  try{
    const rawTxt = localStorage.getItem(BOARD_CACHE_KEY);
    if(!rawTxt) return null;
    const parsed = JSON.parse(rawTxt);
    if(!parsed || !parsed.schema) return null;
    let meta = null;
    try{ meta = JSON.parse(localStorage.getItem(BOARD_CACHE_META) || 'null'); }catch(e){ meta = null; }
    return { d: parsed, src: (meta && meta.src) || 'localStorage 缓存', cachedAt: (meta && meta.at) || null };
  }catch(e){ return null; }
}
function writeCache(d, src){
  try{
    localStorage.setItem(BOARD_CACHE_KEY, JSON.stringify(d));
    localStorage.setItem(BOARD_CACHE_META, JSON.stringify({ src: src, at: new Date().toISOString(), generatedAt: d.generatedAt || null }));
  }catch(e){ /* 配额满/隐私模式：静默降级，不影响在线取数 */ }
}
function cacheMetaTime(){
  try{
    const meta = JSON.parse(localStorage.getItem(BOARD_CACHE_META) || 'null');
    if(meta && meta.at) return meta.at;
  }catch(e){}
  return null;
}

async function fetchOne(url){
  const r = await fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + '_=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(!j || typeof j !== 'object') throw new Error('响应不是 JSON 对象');
  return j;
}

// 主取数：按顺序尝试前两源；失败再落到 localStorage 缓存。返回 { d, src, fromCache, lastSuccessAt, errors }
async function fetchBoard(){
  const errors = [];
  const candidates = [BOARD_SOURCE_RAW, BOARD_SOURCE_SELF];
  for (const u of candidates){
    try{
      const d = await fetchOne(u);
      writeCache(d, u);
      return { d: d, src: u, fromCache: false, lastSuccessAt: new Date().toISOString(), errors: errors };
    }catch(e){
      errors.push(u + ' → ' + (e && e.message ? e.message : String(e)));
    }
  }
  const cached = readCache();
  if(cached){
    return { d: cached.d, src: cached.src, fromCache: true,
             lastSuccessAt: cached.cachedAt || cacheMetaTime(), errors: errors };
  }
  return { d: null, src: null, fromCache: false, lastSuccessAt: cacheMetaTime(), errors: errors };
}

let LAST_LOAD_ERRORS = [];
async function load(){
  $('#gen').textContent = '加载 board.json …';
  try{
    const got = await fetchBoard();
    LAST_LOAD_ERRORS = got.errors || [];
    if(!got.d){
      const lastTxt = got.lastSuccessAt
        ? ('上次成功时间：' + got.lastSuccessAt)
        : '上次成功时间：无（此前从未成功加载过）';
      $('#gen').innerHTML = '<span class="err">board.json 读取失败：全部数据源不可用</span>'
        + '<div class="note mt2">' + esc(lastTxt) + '</div>'
        + '<div class="note">失败明细：' + esc((LAST_LOAD_ERRORS.join(' | ')) || '未知') + '</div>'
        + '<div class="note">点右下角刷新重试。</div>';
      $('#src').textContent = 'board.json · 读取失败';
      return;
    }
    const d = got.d;
    $('#ver').textContent = d.schema || 'board/v1';
    const srcLabel = got.fromCache ? ('离线缓存 · ' + got.src) : got.src;
    $('#gen').textContent = '生成于 ' + (d.generatedAt || '未知') + '　·　数据源：' + srcLabel;
    $('#src').textContent = 'board.json · ' + ((d.generatedAt||'').slice(0,16));
    window.__boardData = d;
    window.__boardMeta = got;
    updateFreshnessBanner(d);
    if(got.fromCache){
      const bar = document.getElementById('freshbar');
      if(bar){
        bar.hidden = false;
        bar.className = 'freshbar warn';
        bar.textContent = '离线模式 · 数据时点 ' + (d.generatedAt || '未知');
      }
    }
    renderToday(d); renderIPS(d); renderRules(d);
    renderAudit(d); renderNationalTeamPage(d); renderSettings(d);
  }catch(e){
    const lastTxt = cacheMetaTime() ? ('上次成功时间：' + cacheMetaTime()) : '上次成功时间：无（此前从未成功加载过）';
    $('#gen').innerHTML = '<span class="err">board.json 读取失败：' + esc(e.message) + '</span>'
      + '<div class="note mt2">' + esc(lastTxt) + '</div>';
  }
}

const TAB_KEYS = ['today','ips','rules','audit','nt','settings'];
$('#tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...document.querySelectorAll('#tabs button')].forEach(x=>x.classList.toggle('on', x===b));
  TAB_KEYS.forEach(t=>{ $('#s-'+t).hidden = (t!==b.dataset.t); });
});
function showTab(t){
  if(!t || TAB_KEYS.indexOf(t)<0) t='today';
  [...document.querySelectorAll('#tabs button')].forEach(x=>x.classList.toggle('on', x.dataset.t===t));
  TAB_KEYS.forEach(k=>{ $('#s-'+k).hidden = (k!==t); });
}
window.addEventListener('hashchange', ()=>showTab(location.hash.slice(1)));
load().then(()=>showTab(location.hash.slice(1)));

// ── Service Worker：board.json 离线只读缓存（stale-while-revalidate）──
// 用 Blob URL 内联注册（免多出一个 sw.js）；file:// 或受限环境失败时静默降级（localStorage 兜底）。
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:') return;          // file:// 下 SW 不可用，静默跳过
  const swSource = [
    "const CACHE='board-sw-v1';",
    "self.addEventListener('install',e=>{self.skipWaiting();});",
    "self.addEventListener('activate',function(e){ e.waitUntil( caches.keys().then(function(ks){ return Promise.all( ks.filter(function(k){ return k!==CACHE; }).map(function(k){ return caches.delete(k); }) ); }).then(function(){ return self.clients.claim(); }) ); });",
    "self.addEventListener('fetch',e=>{",
    "  const req=e.request;",
    "  if(req.method!=='GET') return;",
    "  const url=new URL(req.url);",
    "  const sameOrigin=url.origin===self.location.origin;",
    "  const isBoard=sameOrigin && /(^|\\/)data\\/board\\.json(\\?|$)/.test(url.pathname+url.search);",
    "  const isRaw=url.host==='raw.githubusercontent.com' && /finhub-data\\/main\\/board\\.json/.test(url.pathname);",
    "  if(!isBoard && !isRaw) return;",
    "  e.respondWith(caches.open(CACHE).then(cache=>cache.match(req).then(hit=>{",
    "    const net=fetch(req).then(res=>{",
    "      if(res && res.ok) { const copy=res.clone(); cache.put(req,copy); }",
    "      return res;",
    "    }).catch(()=>hit);",
    "    return hit || net;",
    "  })));",
    "});"
  ].join('\n');
  try{
    const blobUrl = URL.createObjectURL(new Blob([swSource], {type:'text/javascript'}));
    navigator.serviceWorker.register(blobUrl).catch(()=>{});
  }catch(e){ /* 静默降级：localStorage 缓存已在 fetchBoard 里兜底 */ }
}
try{ registerServiceWorker(); }catch(e){}

// ── PWA 安装提示 ──
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(evt){
  evt.preventDefault();
  deferredInstallPrompt = evt;
  window.__canInstall = true;
  renderInstallPrompt();
});
window.addEventListener('appinstalled', function(){
  deferredInstallPrompt = null;
  window.__canInstall = false;
  renderInstallPrompt();
});
function renderInstallPrompt(){
  const box = document.getElementById('installPrompt');
  if(!box) return;
  const canInstall = !!deferredInstallPrompt;
  box.innerHTML = canInstall
    ? '<b>把看板装到手机主屏</b><span class="dim">离线也能打开，显示上次数据</span>'
      + '<button id="installBtn" type="button">添加到主屏</button>'
    : '<b>添加到主屏</b><span class="dim">Android Chrome：右上角菜单 → 添加到主屏幕；'
      + 'iOS Safari：分享按钮 → 添加到主屏幕；桌面 Chrome/Edge：地址栏右侧安装图标。</span>';
  const btn = document.getElementById('installBtn');
  if(btn) btn.addEventListener('click', promptInstall);
}
async function promptInstall(){
  if(!deferredInstallPrompt) return;
  const p = deferredInstallPrompt;
  deferredInstallPrompt = null;
  try{
    p.prompt();
    const choice = await p.userChoice;
    window.__installChoice = choice && choice.outcome;
  }catch(e){ window.__installChoice = 'error'; }
  renderInstallPrompt();
}
</script>
