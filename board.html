<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>治理看板 · IPS / 因子 / 新闻 / 推演</title>
<style>
:root{--bg:#0a0e14;--card:#111823;--line:#1e2a3a;--txt:#d8e2ef;--dim:#6b7f96;
--ok:#3ddc97;--warn:#ffb340;--bad:#ff5c5c;--acc:#4da3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:0 0 60px}
header{position:sticky;top:0;z-index:9;background:linear-gradient(180deg,#0a0e14 70%,rgba(10,14,20,0));padding:14px 16px 18px}
h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
h1 small{font-weight:400;color:var(--dim);font-size:11px}
.meta{color:var(--dim);font-size:11px;margin-top:4px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
main{padding:14px 16px}
.card{overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 .tag{font-size:10px;padding:2px 7px;border-radius:999px;background:#0b1220;color:var(--dim);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-right:4px}
.pill.ok{color:var(--ok);border-color:#1d4b3a}.pill.warn{color:var(--warn);border-color:#4b3d1d}.pill.bad{color:var(--bad);border-color:#4b1d1d}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--dim)}
.hops{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.hop{margin-bottom:10px;position:relative}
.hop::before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.hop b{font-size:12.5px}
.bar{height:6px;background:#0b1220;border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--acc)}
.err{color:var(--bad);font-size:12px}
footer{position:fixed;bottom:0;left:0;right:0;background:#070b11;border-top:1px solid var(--line);
padding:8px 16px;font-size:11px;color:var(--dim);display:flex;gap:10px;justify-content:space-between}
button.reload{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 8px;font-size:11px}
@media (max-width:560px){
  table,thead,tbody,tr,td,th{display:block;width:auto}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#0d141e}
  td{border:0;padding:3px 0}
  td.num{text-align:left}
  td:first-child{font-size:13px}
  .kv{grid-template-columns:88px 1fr}
}
.freshbar{position:sticky;top:0;z-index:20;margin:0 0 10px;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5}
.freshbar.ok{background:#12301f;border:1px solid #1d4b3a;color:#3ddc97}
.freshbar.warn{background:#33290f;border:1px solid #4b3d1d;color:#ffb340}
.freshbar.bad{background:#3a1717;border:1px solid #4b1d1d;color:#ff5c5c}
.installbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0f1b2b;border:1px solid #1e3a5f;
  border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
.installbar button{background:var(--acc);border:0;color:#04101f;font-weight:600;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer}
.installbar button:disabled{background:#1e2a3a;color:var(--dim);cursor:default}
.installbar .dim{font-size:11px}
</style>
</head>
<body>
<div id="freshbar" class="freshbar" hidden></div>
<header>
  <h1>治理看板 <small id="ver">—</small></h1>
  <div class="meta" id="gen">加载中…</div>
</header>

<nav id="tabs">
  <button data-t="today" class="on">今日简报</button>
  <button data-t="ips">配置仪表</button>
  <button data-t="factor">因子信号</button>
  <button data-t="news">新闻事件</button>
  <button data-t="chain">推演假设</button>
  <button data-t="watch">观察清单</button>
  <button data-t="audit">审计留痕</button>
  <button data-t="nt">国家队</button>
  <button data-t="settings">设置</button>
</nav>

<main>
  <section id="s-today"></section>
  <section id="s-ips" hidden></section>
  <section id="s-factor" hidden></section>
  <section id="s-news" hidden></section>
  <section id="s-chain" hidden></section>
  <section id="s-audit" hidden></section>
  <section id="s-watch" hidden></section>
  <section id="s-nt" hidden></section>
  <section id="s-settings" hidden></section>
</main>

<footer>
  <span id="src">data/board.json</span>
  <button class="reload" onclick="load()">刷新</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => (n==null||n==='')?'—':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});

function card(title, tag, body){ return `<div class="card"><h2>${esc(title)}<span class="tag">${esc(tag||'')}</span></h2>${body}</div>`; }

// ── IPS 五项 ──
function renderIPS(d){
  const ips = d.ips || {};
  const rows = (ips.items||[]).map(it=>{
    const cls = it.status==='ok'?'ok':(it.status==='gap'?'bad':'warn');
    return `<tr><td><b>${esc(it.name)}</b><div class="dim" style="font-size:11px">${esc(it.source||'')}</div></td>
      <td class="num">${esc(it.value==null?'—':it.value)}</td>
      <td class="${cls}" style="font-size:11px">${esc(it.note||'')}</td></tr>`;
  }).join('');
  let h = card('IPS 一页速查', ips.asOf||'', `
    <table><thead><tr><th>项</th><th style="text-align:right">值</th><th>说明 / 来源</th></tr></thead>
    <tbody>${rows||'<tr><td colspan=3 class="err">contracts 未就绪</td></tr>'}</tbody></table>
    <div class="dim" style="font-size:11px;margin-top:8px">${esc(ips.footer||'')}</div>`);
  if (ips.alerts && ips.alerts.length){
    h += card('⚠ 当前失效项', String(ips.alerts.length), ips.alerts.map(a=>`<div class="err">· ${esc(a)}</div>`).join(''));
  }
  $('#s-ips').innerHTML = h;
}

// ── 因子登记 ──
function renderFactor(d){
  const f = d.factors || {};
  const sum = f.summary || {};
  const items = f.factors || [];
  const grp = {};
  items.forEach(x=>{ const k=(x.kind==='exposure' ? (x.variant||'exposure') : 'predictive'); grp[k]=(grp[k]||0)+1; });
  let h = card('因子总数（不可相加）', f.asOf||'', `<div class="kv">
    <div>暴露·资产类别</div><div><b>${grp['asset-class']||0}</b> 个</div>
    <div>暴露·因果合并</div><div><b>${grp['causal-chain']||0}</b> 个</div>
    <div>预测因子</div><div><b>${grp['predictive']||0}</b> 个</div>
    <div>合计行数</div><div>${items.length} 条 <span class="dim">（8+6+11，前两者同源两套口径，不可相加）</span></div>
    <div>说明</div><div class="dim">${esc(sum.note||'三类因子含义不同，不可相加')}</div></div>`);
  const tbody = items.map(x=>{
    // board.json 里 correlations 可能是数组，也可能是 {}（空对象）；非数组一律当空处理。
    const corrRaw = x.correlations;
    const corrList = Array.isArray(corrRaw) ? corrRaw : [];
    const cs = corrList.filter(c=>c && c.r!=null && Math.abs(Number(c.r))>=0.7);
    const cTxt = cs.length ? cs.map(c=>`${esc(c.with)} ${Number(c.r)>0?'+':''}${Number(c.r).toFixed(3)}`).join(' · ') : '<span class="dim">—</span>';
    return `<tr><td><b>${esc(x.id)}</b><div class="dim" style="font-size:11px">${esc(x.label||'')}</div></td>
      <td><span class="pill">${esc(x.kind)}</span></td>
      <td style="font-size:11px">${esc(x.direction||'—')}<div class="dim">${esc(x.updateFrequency||'')}</div></td>
      <td style="font-size:11px">${cTxt}</td>
      <td style="font-size:11px" class="dim">${esc(x.invalidation||'—')}</td></tr>`;
  }).join('');
  h += card('因子清单', items.length+' 条', `<table><thead><tr><th>id</th><th>类</th><th>方向/频率</th><th>|r|≥0.7</th><th>失效条件</th></tr></thead>
    <tbody>${tbody||'<tr><td colspan=5 class="err">contracts 未就绪</td></tr>'}</tbody></table>`);
  if (f.unknowns && f.unknowns.length){
    h += card('未知项', String(f.unknowns.length), f.unknowns.map(u=>`<div class="dim" style="font-size:12px">· ${esc(u)}</div>`).join(''));
  }
  $('#s-factor').innerHTML = h;
}

// ── 新闻映射 ──
function renderNews(d){
  const n = d.news || {};
  const evs = n.events || [];
  let h = card('事件映射字典', evs.length+' 类', `<table><thead><tr><th>事件类型</th><th>受影响因子</th><th>资产影响</th><th>可信度</th></tr></thead><tbody>` +
    (evs.map(e=>`<tr><td><b>${esc(e.eventType)}</b><div class="dim" style="font-size:11px">${esc(e.frequency||'')}</div></td>
      <td style="font-size:11px">${(e.affectedFactors||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</td>
      <td style="font-size:11px">${(e.assetImpact||[]).map(a=>`${esc(a.asset)}：${esc(a.direction)}/${esc(a.strength)} <span class="dim">${esc(a.lag||'')}</span>`).join('<br>')}</td>
      <td><span class="pill ${e.confidence==='A'?'ok':(e.confidence==='C'?'warn':'')}">${esc(e.confidence||'?')}</span></td></tr>`).join('')
      || '<tr><td colspan=4 class="err">contracts 未就绪</td></tr>') + '</tbody></table>');
  const wl = n.sourceWhitelist || [];
  if (wl.length) h += card('来源白名单', wl.length+' 源', `<div>${wl.map(s=>`<span class="pill ${s.tier==='A'?'ok':''}">${esc(s.name||s.id)}</span>`).join('')}</div>`);
  $('#s-news').innerHTML = h;
}

// ── 推演规则 ──
function renderChain(d){
  const c = d.chain || {};
  const r = c.rules || {};
  let h = card('链式推演规则', 'chain-rules/v1', `<div class="kv">
    <div>跳数上限</div><div><b class="${r.maxHops?'ok':'bad'}">${esc(r.maxHops==null?'未设':r.maxHops)}</b> 跳</div>
    <div>每跳必填</div><div>${(r.requiredPerHop||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
    <div>必须回答</div><div class="warn">${esc(r.mustAnswer||'—')}</div>
    <div>是否触发交易</div><div class="${r.mayTriggerTrade?'bad':'ok'}">${r.mayTriggerTrade?'可以（危险）':'不可以，仅生成假设'}</div>
    <div>事后校准</div><div>${esc(r.calibration||'—')}</div></div>`);
  if (r.knownDeviations && r.knownDeviations.length){
    h += card('已知偏离（如实登记）', String(r.knownDeviations.length),
      r.knownDeviations.map(x=>`<div class="err" style="font-size:12px">· ${esc(x.what||x)}<div class="dim">${esc(x.recordedIn||'')}</div></div>`).join(''));
  }
  if (c.example){
    const e = c.example;
    h += card('示例记录', esc(e.recordId||''), (e.hops||[]).map(hp=>`
      <div class="hops"><div class="hop"><b>第 ${esc(hp.hop)} 跳</b> <span class="pill ${(hp.probability>=0.7)?'ok':((hp.probability>=0.4)?'warn':'bad')}">p=${esc(hp.probability)}</span>
      <div>${esc(hp.claim)}</div>
      <div class="bar"><i style="width:${Math.round((hp.probability||0)*100)}%"></i></div>
      <div class="dim" style="font-size:11px">观测：${esc(hp.observable)}<br>失效：${esc(hp.invalidation)}</div></div></div>`).join('')
      + (function(c){
      if(c && typeof c==='object'){
        return `<div style="font-size:12px;margin-top:8px">
          <div><b>裁决：</b>${esc(c.verdict||'—')}</div>
          <div class="dim" style="margin-top:4px">${esc(c.text||'')}</div>
          ${c.weightEffect?`<div style="margin-top:6px"><b>权重影响：</b><span class="dim">${esc(c.weightEffect)}</span></div>`:''}
          ${c.whatWouldChangeIt?`<div style="margin-top:6px"><b>什么会推翻它：</b><span class="warn">${esc(c.whatWouldChangeIt)}</span></div>`:''}
        </div>`;
      }
      return `<div class="dim" style="font-size:11px;margin-top:6px">结论：${esc(c||'')}</div>`;
    })(e.conclusion));
  }
  $('#s-chain').innerHTML = h;
}



// ── 移动端三件：时效横幅 / 国家队 / 通知（2026-11-03）──
function updateFreshnessBanner(d){
  const f = d._freshness; const el = document.getElementById('freshbar');
  if(!el) return;
  if(!f){ el.className='freshbar warn'; el.textContent='⚠ 无时效信息（数据可能过期）'; el.hidden=false; return; }
  el.hidden = false;
  if(f.worst==='critical'){ el.className='freshbar bad'; }
  else if(f.worst==='stale'){ el.className='freshbar warn'; }
  else { el.className='freshbar ok'; }
  let txt = f.worst==='critical' ? '⚠ ' : (f.worst==='stale' ? '△ ' : '✓ ');
  txt += f.banner;
  const h = (f.items||[]).find(x=>x.id==='holdings');
  if(h && h.asOf) txt += '　（持仓 ' + h.asOf + (h.ageDays!=null?' / '+h.ageDays+'天':'') + '）';
  el.textContent = txt;
}

function renderNationalTeam(d){
  const n = d.nationalTeam; if(!n) return '';
  if(!n.ok){
    return card('国家队动向','未接入', '<div class="err">拉取失败：'+esc(n.error||'未知')+'</div>'
      + '<div class="dim" style="font-size:11px">源：166.88.14.220:38657（朋友提供）。失败时明确报错，不显示旧数。</div>');
  }
  const s = n.summary||{}; const items = n.items||[];
  let h = card('国家队动向','F2-补 宽基净申购', '<div class="kv">'
    + '<div>采集正常</div><div class="ok">'+esc(n.lastSuccess||'—')+'</div>'
    + '<div>区间</div><div>'+esc(n.datePrev||'—')+' → '+esc(n.dateCurrent||'—')+'</div>'
    + '<div>共监控</div><div><b>'+(s.total||0)+'</b> 只 <span class="dim">增 '+(s.up||0)+' / 减 '+(s.down||0)+'</span></div></div>'
    + '<table style="margin-top:8px"><thead><tr><th>ETF</th><th style="text-align:right">份额变化</th><th style="text-align:right">%</th></tr></thead><tbody>'
    + items.slice(0,6).map(x=>'<tr><td>'+esc(x.name||x.code)+'<div class="dim" style="font-size:10px">'+esc(x.code)+'</div></td>'
        + '<td class="num '+(x.deltaShares>0?'ok':'bad')+'">'+(x.deltaShares>0?'+':'')+(x.deltaWan!=null?x.deltaWan:'?')+' 万份</td>'
        + '<td class="num">'+(x.deltaPct>0?'+':'')+x.deltaPct+'%</td></tr>').join('')
    + '</tbody></table>'
    + '<div class="dim" style="font-size:11px;margin-top:6px">'+esc(n.discipline||'')+'</div>');
  return h;
}

// ── 国家队独立页（第 9 个 tab，比今日卡更详细）──
function renderNationalTeamPage(d){
  const n = d.nationalTeam;
  const el = $('#s-nt');
  if(!n){
    el.innerHTML = card('国家队动向','未接入','<div class="err">board.json 里没有 nationalTeam 段。</div>');
    return;
  }
  if(!n.ok){
    el.innerHTML = card('国家队动向','采集失败',
        '<div class="err">拉取失败：'+esc(n.error||'未知')+'</div>'
      + '<div class="dim" style="font-size:12px;margin-top:8px">失败时<strong>不显示旧数</strong>，避免把过期份额变化当成今天的信号。</div>'
      + '<div class="dim" style="font-size:11px;margin-top:6px">源：166.88.14.220:38657（朋友提供）。</div>');
    return;
  }
  const s = n.summary||{};
  const items = Array.isArray(n.items) ? n.items : [];
  const totalSummary = (s.total!=null) ? Number(s.total) : items.length;
  const rows = items.map(function(x){
    const up = Number(x.deltaShares)>0;
    const down = Number(x.deltaShares)<0;
    const cls = up ? 'ok' : (down ? 'bad' : '');
    const sign = up ? '+' : '';
    const wan = (x.deltaWan!=null) ? Number(x.deltaWan).toLocaleString('zh-CN',{maximumFractionDigits:0}) : (x.deltaShares!=null ? (Number(x.deltaShares)/10000).toFixed(0) : null);
    const pctTxt = (x.deltaPct!=null) ? ((Number(x.deltaPct)>0?'+':'')+Number(x.deltaPct).toFixed(2)+'%') : '—';
    return '<tr><td><b>'+esc(x.name||x.code)+'</b></td>'
      + '<td class="dim">'+esc(x.code||'')+'</td>'
      + '<td class="num '+cls+'">'+(wan!=null?sign+wan:'—')+'</td>'
      + '<td class="num '+cls+'">'+pctTxt+'</td></tr>';
  }).join('');
  // 明细行数与 summary.total 不一致时如实说明，不假装列全了。
  const gapNote = (items.length !== totalSummary)
    ? '<div class="warn" style="font-size:11.5px;margin-top:8px">⚠ board.json 的 nationalTeam.items 本次只有 <b>'+items.length+'</b> 行明细，'
      + '而 summary.total 记为 <b>'+totalSummary+'</b> 只（增 '+esc(s.up||0)+' / 减 '+esc(s.down||0)+'）。'
      + '汇总数字来自采集端口径，明细只渲染 board.json 实际下发的行，不补齐、不推测缺失项。</div>'
    : '';
  let h = card('国家队动向 · 全量', 'F2-补 宽基净申购',
      '<div class="kv">'
    + '<div>采集状态</div><div class="ok">'+esc(n.lastSuccess||'—')+'</div>'
    + '<div>区间</div><div>'+esc(n.datePrev||'—')+' → '+esc(n.dateCurrent||'—')+'</div>'
    + '<div>汇总</div><div>共 '+esc(totalSummary)+' 只　'
      + '<span class="ok">增 '+esc(s.up||0)+'</span> / '
      + '<span class="bad">减 '+esc(s.down||0)+'</span>'
      + (s.flat!=null?' / <span class="dim">平 '+esc(s.flat)+'</span>':'')+'</div></div>' + gapNote);
  h += card('ETF 明细', items.length+' 只',
      '<table><thead><tr><th>ETF名</th><th>代码</th><th style="text-align:right">份额变化(万份)</th><th style="text-align:right">变化%</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="4" class="err">无明细</td></tr>')
    + '</tbody></table>');
  h += card('口径纪律（原文）', '必读', '<div style="font-size:12.5px;white-space:pre-wrap">'+esc(n.discipline||'（board.json 未提供 discipline 字段）')+'</div>'
    + '<div class="dim" style="font-size:11px;margin-top:8px">原文直出，不做二次解读。</div>');
  el.innerHTML = h;
}

function renderNotifications(d){
  const q = d.notifications; if(!q) return '';  const lv = q.byLevel||{}; const items = q.items||[];
  const cls = {urgent:'bad', watch:'warn', info:'ok'};
  const cn = {urgent:'紧急', watch:'观察', info:'信息'};
  let h = card('通知', (q.count||0)+' 条', '<div class="kv">'
    + '<div>分级</div><div><span class="pill bad">紧急 '+(lv.urgent||0)+'</span> <span class="pill warn">观察 '+(lv.watch||0)+'</span> <span class="pill">信息 '+(lv.info||0)+'</span></div>'
    + '<div>策略</div><div class="dim">'+esc(q.policy||'')+'</div></div>'
    + (items.length? items.map(x=>'<div style="border-left:3px solid var(--line);padding-left:10px;margin-top:8px">'

function askNotify(){
  const el=document.getElementById('notifyState');
  if(!('Notification' in window)){ if(el) el.textContent='本环境不支持通知 API'; return; }
  Notification.requestPermission().then(p=>{
    if(el) el.textContent = '通知权限：'+p;

      const q=(window.__boardData||{}).notifications||{};
      const urgent=(Array.isArray(q.items)?q.items:[]).filter(x=>x.level==='urgent');
      urgent.forEach((x,i)=>setTimeout(()=>{ try{ new Notification('【紧急】'+x.title,{body:x.body,tag:x.id}); }catch(e){} }, i*800));
    }
  });
}

// ── 加载 ──
// 三源降级（先到先得，每个带 ?_=Date.now() 破缓存）：
//   1) ./data/board.json  同域 Pages 自托管，40 秒内刷新（绕开 CDN 滞后）
//   2) raw.githubusercontent.com 公开仓库兜底
//   3) localStorage 上次成功数据（离线可读）
// 全部失败 → 显示错误 + 「上次成功时间」，绝不显示成 0 或空成功。
const BOARD_SOURCE_SELF  = './data/board.json';
const BOARD_SOURCE_RAW   = 'https://raw.githubusercontent.com/2647805640max-lab/finhub-data/main/board.json';
const BOARD_CACHE_KEY    = 'board.cache.v1';
const BOARD_CACHE_META   = 'board.cache.meta.v1';

function readCache(){
  try{
    const rawTxt = localStorage.getItem(BOARD_CACHE_KEY);
    if(!rawTxt) return null;
    const parsed = JSON.parse(rawTxt);
    if(!parsed || !parsed.schema) return null;
    let meta = null;
    try{ meta = JSON.parse(localStorage.getItem(BOARD_CACHE_META) || 'null'); }catch(e){ meta = null; }
    return { d: parsed, src: (meta && meta.src) || 'localStorage 缓存', cachedAt: (meta && meta.at) || null };
  }catch(e){ return null; }
}
function writeCache(d, src){
  try{
    localStorage.setItem(BOARD_CACHE_KEY, JSON.stringify(d));
    localStorage.setItem(BOARD_CACHE_META, JSON.stringify({ src: src, at: new Date().toISOString(), generatedAt: d.generatedAt || null }));
  }catch(e){ /* 配额满/隐私模式：静默降级，不影响在线取数 */ }
}
function cacheMetaTime(){
  try{
    const meta = JSON.parse(localStorage.getItem(BOARD_CACHE_META) || 'null');
    if(meta && meta.at) return meta.at;
  }catch(e){}
  return null;
}

async function fetchOne(url){
  const r = await fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + '_=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(!j || typeof j !== 'object') throw new Error('响应不是 JSON 对象');
  return j;
}

// 主取数：按顺序尝试 前两源；失败再落到 localStorage 缓存。
// 返回 { d, src, fromCache, lastSuccessAt, errors }
async function fetchBoard(){
  const errors = [];
  const candidates = [BOARD_SOURCE_SELF, BOARD_SOURCE_RAW];
  for (const u of candidates){
    try{
      const d = await fetchOne(u);
      writeCache(d, u);
      return { d: d, src: u, fromCache: false, lastSuccessAt: new Date().toISOString(), errors: errors };
    }catch(e){
      errors.push(u + ' → ' + (e && e.message ? e.message : String(e)));
    }
  }
  const cached = readCache();
  if(cached){
    return { d: cached.d, src: cached.src, fromCache: true,
             lastSuccessAt: cached.cachedAt || cacheMetaTime(), errors: errors };
  }
  return { d: null, src: null, fromCache: false, lastSuccessAt: cacheMetaTime(), errors: errors };
}

let LAST_LOAD_ERRORS = [];
async function load(){
  $('#gen').textContent = '加载 board.json …';
  try{
    const got = await fetchBoard();
    LAST_LOAD_ERRORS = got.errors || [];
    if(!got.d){
      const lastTxt = got.lastSuccessAt
        ? ('上次成功时间：' + got.lastSuccessAt)
        : '上次成功时间：无（此前从未成功加载过）';
      $('#gen').innerHTML = '<span class="err">board.json 读取失败：全部数据源不可用</span>'
        + '<div class="dim" style="font-size:11px;margin-top:4px">' + esc(lastTxt) + '</div>'
        + '<div class="dim" style="font-size:11px">失败明细：' + esc((LAST_LOAD_ERRORS.join(' | ')) || '未知') + '</div>'
        + '<div class="dim" style="font-size:11px">点右下角刷新重试。</div>';
      $('#src').textContent = 'board.json · 读取失败';
      return;
    }
    const d = got.d;
    $('#ver').textContent = d.schema || 'board/v1';
    const srcLabel = got.fromCache ? ('离线缓存 · ' + got.src) : got.src;
    $('#gen').textContent = '生成于 ' + (d.generatedAt || '未知') + '　·　数据源：' + srcLabel;
    $('#src').textContent = 'board.json · ' + ((d.generatedAt||'').slice(0,16));
    window.__boardData = d;
    window.__boardMeta = got;
    updateFreshnessBanner(d);
    if(got.fromCache){
      const bar = document.getElementById('freshbar');
      if(bar){
        bar.hidden = false;
        bar.className = 'freshbar warn';
        bar.textContent = '离线模式 · 数据时点 ' + (d.generatedAt || '未知');
      }
    }
    renderToday(d); renderIPS(d); renderFactor(d); renderNews(d); renderChain(d);
    renderAudit(d); renderWatch(d); renderNationalTeamPage(d); renderSettings(d);
  }catch(e){
    const lastTxt = cacheMetaTime() ? ('上次成功时间：' + cacheMetaTime()) : '上次成功时间：无（此前从未成功加载过）';
    $('#gen').innerHTML = '<span class="err">board.json 读取失败：' + esc(e.message) + '</span>'
      + '<div class="dim" style="font-size:11px;margin-top:4px">' + esc(lastTxt) + '</div>';
  }
}

// ── Service Worker：board.json 离线只读缓存（stale-while-revalidate）──
// 用 Blob URL 内联注册，避免多出一个 sw.js 文件；file:// 或受限环境失败时静默降级（localStorage 兜底）。
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:') return;          // file:// 下 SW 不可用，静默跳过
  const swSource = [
    "const CACHE='board-sw-v1';",
    "self.addEventListener('install',e=>{self.skipWaiting();});",
    "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))).then(()=>self.clients.claim()));});",
    "self.addEventListener('fetch',e=>{",
    "  const req=e.request;",
    "  if(req.method!=='GET') return;",
    "  const url=new URL(req.url);",
    "  const sameOrigin=url.origin===self.location.origin;",
    "  const isBoard=sameOrigin && /(^|\\/)data\\/board\\.json(\\?|$)/.test(url.pathname+url.search);",
    "  const isRaw=url.host==='raw.githubusercontent.com' && /finhub-data\\/main\\/board\\.json/.test(url.pathname);",
    "  if(!isBoard && !isRaw) return;",
    "  e.respondWith(caches.open(CACHE).then(cache=>cache.match(req).then(hit=>{",
    "    const net=fetch(req).then(res=>{",
    "      if(res && res.ok) { const copy=res.clone(); cache.put(req,copy); }",
    "      return res;",
    "    }).catch(()=>hit);",
    "    return hit || net;",
    "  })));",
    "});"
  ].join('\n');
  try{
    const blobUrl = URL.createObjectURL(new Blob([swSource], {type:'text/javascript'}));
    navigator.serviceWorker.register(blobUrl).catch(()=>{});
  }catch(e){ /* 静默降级：localStorage 缓存已在 fetchBoard 里兜底 */ }
}
try{ registerServiceWorker(); }catch(e){}

// ── PWA 安装提示 ──
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(evt){
  evt.preventDefault();
  deferredInstallPrompt = evt;
  window.__canInstall = true;
  renderInstallPrompt();
});
window.addEventListener('appinstalled', function(){
  deferredInstallPrompt = null;
  window.__canInstall = false;
  renderInstallPrompt();
});
function renderInstallPrompt(){
  const box = document.getElementById('installPrompt');
  if(!box) return;
  const canInstall = !!deferredInstallPrompt;
  box.innerHTML = canInstall
    ? '<b>把看板装到手机主屏</b><span class="dim">离线也能打开，显示上次数据</span>'
      + '<button id="installBtn" type="button">添加到主屏</button>'
    : '<b>添加到主屏</b><span class="dim">Android Chrome：右上角菜单 → 添加到主屏幕；'
      + 'iOS Safari：分享按钮 → 添加到主屏幕；桌面 Chrome/Edge：地址栏右侧安装图标。</span>';
  const btn = document.getElementById('installBtn');
  if(btn) btn.addEventListener('click', promptInstall);
}
async function promptInstall(){
  if(!deferredInstallPrompt) return;
  const p = deferredInstallPrompt;
  deferredInstallPrompt = null;
  try{
    p.prompt();
    const choice = await p.userChoice;
    window.__installChoice = choice && choice.outcome;
  }catch(e){ window.__installChoice = 'error'; }
  renderInstallPrompt();
}
