  window.__boardMeta = got;
  renderAll(got.d);
}
/* 绑定治理页里的按钮（inline handler 会被全局同名函数劫持，故一律程序化绑定） */
function bindGovButtons(){
  const notifyBtn = document.getElementById('govNotifyBtn');
  if(notifyBtn && !notifyBtn.dataset.bound){ notifyBtn.dataset.bound='1'; notifyBtn.addEventListener('click', askNotify); }
  const reloadBtn = document.getElementById('govReloadBtn');
  if(reloadBtn && !reloadBtn.dataset.bound){ reloadBtn.dataset.bound='1'; reloadBtn.addEventListener('click', govReload); }
  const installBtn = document.getElementById('installBtn');
  if(installBtn && !installBtn.dataset.bound){ installBtn.dataset.bound='1'; installBtn.addEventListener('click', promptInstall); }
}
/* 治理页 tab 切换（沿用 board 原 showTab 语义，作用于 #govnav / #s-*） */
function govShowTab(tabName){
  if(!tabName || TAB_KEYS.indexOf(tabName)<0) tabName='today';
  [...document.querySelectorAll('#govnav button')].forEach(function(btn){ btn.classList.toggle('on', btn.dataset.t===tabName); });
  TAB_KEYS.forEach(function(key){ const el=document.getElementById('s-'+key); if(el) el.hidden=(key!==tabName); });
  return tabName;
}
document.getElementById('govnav').addEventListener('click', function(ev){
  const btn = ev.target.closest ? ev.target.closest('button') : null; if(!btn) return;
  govShowTab(btn.dataset.t);
});
window.GOV = {
  render: function(d){ applyBoardData(d); },
  showTab: function(t){ return govShowTab(t); },
  reload: govReload,
  TAB_KEYS: TAB_KEYS
};
/* 时序兜底：若 index-remote 的 loadExtras() 在本 IIFE 之前已完成，补渲染一次 */
if(window.__extrasData){ applyBoardData(window.__extrasData); }

})();
</script>
<script>

/* ── 单页模式切换：实时 / 治理 ── */
(function(){
  "use strict";
  const MODES=['live','gov','hold'];
  let currentGovTab='today';
  function applyMode(mode){
    if(MODES.indexOf(mode)<0) mode='live';
    MODES.forEach(function(m){
      const el=document.getElementById('page-'+m); if(el) el.hidden=(m!==mode);
    });
    [...document.querySelectorAll('#modebar button')].forEach(function(btn){
      btn.classList.toggle('on', btn.dataset.page===mode);
    });
    if(mode==='gov' && window.GOV && window.GOV.showTab) window.GOV.showTab(currentGovTab);
    try{ window.scrollTo(0,0); }catch(scrollErr){}
    window.__fhMode=mode;
  }
  document.getElementById('modebar').addEventListener('click', function(ev){
    const btn=ev.target.closest ? ev.target.closest('button') : null; if(!btn) return;
    applyMode(btn.dataset.page);
  });
  /* 记住治理页当前 tab，切回实时再切回治理仍停在原处 */
  document.addEventListener('click', function(ev){
    const btn=ev.target.closest ? ev.target.closest('#govnav button') : null; if(!btn) return;
    currentGovTab=btn.dataset.t||'today';
  }, true);
  window.__fhApplyMode=applyMode;
  applyMode('live');
})();

/* ═══ 持仓快照上传（2026-11-04）═══
   流程：粘贴文本前端解析 =行级校验（红标错行）= POST /api/holdings（X-FH-Key）= VPS 落盘 = PC 下轮回拉本地 finwatch。
   静置 DOM（在 #page-hold 里），不参与 render() 每 60s 重建， zodat 打字内容不会被清空。 */
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const dAttr=d=>d?d:'';
  // 数据日默认今天（本地时区）
  const _d=new Date(); const pad=n=>String(n).padStart(2,'0');
  const today=_d.getFullYear()+'-'+pad(_d.getMonth()+1)+'-'+pad(_d.getDate());
  try{ $('#hdate').value=today; }catch(e){}

  function parseLines(raw, platformFallback){
    const out=[]; const errs=[];
    raw.split(/\r?\n/).forEach((line,idx)=>{
      const t=line.trim();
      if(!t) return;
      const parts=t.split('|').map(x=>x.trim());
      if(parts.length<3){ errs.push({line:idx+1, text:t, reason:'列数少于 3（名称|代码|市值…）'}); return; }
      const name=parts[0], code=parts[1]||'', mv=parseFloat(parts[2].replace(/[,，\s]/g,''));
      if(!name){ errs.push({line:idx+1, text:t, reason:'名称为空'}); return; }
      if(!(mv>0)){ errs.push({line:idx+1, text:t, reason:'市值不是正数'+ (parts[2]||"")}); return; }
      out.push({name, code:code||null, marketValue:mv,
                type:parts[3]||null, sector:parts[4]||null});
    });
    return {items:out, errs:errs};
  }
  function preview(msg, items, errs, losing){
    const el=$('#hmsg'); const box=$('#hpreview'); if(!el||!box) return;
    let errHtml = errs.length?('<div class="concl" style="color:var(--warn)">'
      + errs.map(e=>'第'+e.line+'行：'+e.reason).map(x=>'· '+x).join('<br>')+'</div>'):'';
    let previewHtml='';
    if(items && items.length){
      const total=items.reduce((a,i)=>a+i.marketValue,0)+losing;
      previewHtml='<table>'+ items.map(i=>'<tr><td>'+i.name+'</td><td class="r">'
        + i.marketValue.toFixed(2) + ' 元</td></tr>').join('')
        + '<tr><td style="color:var(--dim)">合计（含现金）</td><td class="r"><b>'+ total.toFixed(2) +' 元</b></td></tr>'
        + '</table>';
    }
    el.innerHTML=(msg||'')+(errHtml?'<br>'+errHtml:'');
    box.innerHTML=previewHtml;
  }
  async function submit(){
    const raw=$('#htext').value;
    if(!raw.trim()){ preview('贴了再说。'); return; }
    const date=$('#hdate').value||today;
    const platform=($('#hplat').value||'').trim();
    const cash=parseFloat(($('#hcash').value||'0').replace(/[,，\s]/g,''))||0;
    if(!platform){ preview('平台必填（支付宝 / 券商 / 银行理财 …）。'); return; }
    const {items,errs}=parseLines(raw, platform);
    if(!items.length){ preview('没有可提交的行。'); return; }
    preview('待提交 '+items.length+' 行'+(errs.length?(' · 有 '+errs.length+' 行错误（仍可提交正确行）'):''), items, errs, cash);
    if(!window.__fhLastRoot){ $('#hmsg').innerHTML='<div class="err">隧道不可达（实时源尚未连上）。等 load 拿到 tunnelUrl 后再试。</div>'; return; }
    if(!window.__fhKeyGet || !window.__fhKeyGet()){ $('#hmsg').innerHTML='<div class="err">先解锁（口令未设置/无效）。</div>'; return; }
    $('#hsubmit').disabled=true; $('#hmsg').innerHTML='<div class="note">提交中…</div>';
    try{
      const r=await fetch(window.__fhLastRoot+'/api/holdings',
        {method:'POST', headers:{'X-FH-Key':window.__fhKeyGet(),'Content-Type':'application/json'},
         body:JSON.stringify({date, platform, cash, items, note:''})});
      const j=await r.json().catch(()=>null);
      if(r.ok && j && j.ok){
        $('#hmsg').innerHTML='<div style="color:var(--ok)">✓ 已入 VPS ledger：'+(j.platform||platform)+' '
          +(j.date||date)+' · '+j.itemCount+' 标的 · 合计 '+j.totalCny+' 元。'
          +'PC 下一轮（≤30 分钟）自动回拉到本地 finwatch。</div>';
        /* 2026-11-04 P0-B 闭环反馈：读取 audit.jsonl 尾部留痕，把 kind=holdings 那条
           实时打出来，用户马上就能看到「VPS 确实写了、写的是什么」。 */
        try{
          const r2=await fetch(window.__fhLastRoot+'/data/audit.jsonl?_=' + Date.now(),
            {cache:'no-store', headers:{'X-FH-Key':window.__fhKeyGet()}});
          if(!r2.ok) throw new Error('audit.jsonl fetched '+r2.status);
          const tail=(await r2.text()).trim().split('\n').filter(Boolean).slice(-8).reverse();
          const hits=tail.map(l=>{try{return JSON.parse(l)}catch(e){return null}})
            .filter(Boolean).filter(x=>x._kind==='holdings');
          if(hits.length){
            const h=hits[0];
            $('#hmsg').innerHTML+='<div class="note" style="margin-top:6px">留痕核对：'
              +(h.ts||'')+' 平台「'+(h.platform||'')+'」·'+(h.items||0)+' 标的·合计 '+(h.total||'')+' 元 '
              +(h._src?('from ' + h._src):'')+'</div>';
          }
        }catch(e){ /* 不阻塞，audit 拿不到就保持第一次的绿条提示 */ }
      }else{
        const why=(j&&j.error)?j.error:(('HTTP '+(r.status||'?')));
        $('#hmsg').innerHTML='<div class="err">提交被拒：'+why+'</div>';
        preview('', items, errs, cash);
      }
    }catch(e){
      $('#hmsg').innerHTML='<div class="err">提交失败：'+(e&&e.message?e.message:e)+'</div>';
    }finally{ $('#hsubmit').disabled=false; }
  }
  document.addEventListener('input', function(ev){
    if(ev.target && ev.target.id==='htext'){ /* 触发即时预览（不提交） */
      const {items,errs}=parseLines(ev.target.value, $('#hplat').value);
      const cash=parseFloat(($('#hcash').value||'0').replace(/[,，\s]/g,''))||0;
      preview(null, items, errs, cash);
    }
  }, true);
  document.addEventListener('click', function(ev){
    const t=ev.target;
    if(t && t.id==='hsubmit'){ ev.preventDefault(); submit(); return; }
    if(t && t.id==='hclear'){
      ev.preventDefault();
      $('#htext').value=''; $('#hpreview').innerHTML=''; $('#hmsg').textContent='';
      return;
    }
  }, true);
  /* ② 一级屏「显示更多」开关（modebar 里的小 checkbox）＋ localStorage 持久化 */
  const _t2=document.getElementById('t2show');
  if(_t2){
    try{
      const saved=localStorage.getItem('fh.showall');
      if(saved==='1'){ _t2.checked=true; document.body.classList.add('showall'); }
      else if(saved==='0'){ _t2.checked=false; document.body.classList.remove('showall'); }
    }catch(e){}
    _t2.addEventListener('change', function(){
      document.body.classList.toggle('showall', this.checked);
      try{ localStorage.setItem('fh.showall', this.checked?'1':'0'); }catch(e){}
    });
  }
})();


/* 深链：?page=gov / #gov / ?page=hold / #hold 直接进对应 mode（PWA shortcuts 用） */
(function(){
  function jumpToMode(){
    try{
      var target = null;
      if(/[?&]page=gov/.test(location.search) || location.hash==='#gov')       target='gov';
      else if(/[?&]page=hold/.test(location.search) || location.hash==='#hold') target='hold';
      if(!target) return;
      var btn=document.querySelector('#modebar button[data-page="'+target+'"]');
      if(btn) btn.click();
    }catch(e){}
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',jumpToMode); }
  else { jumpToMode(); }
  setTimeout(jumpToMode,400);
  setTimeout(jumpToMode,1200);
})();

/* ── 实时性增强（2026-11-03）──
   1) 手机切后台时定时器会被节流；切回前台立刻补一次刷新
   2) 顶部「更新 <时间>」后面持续显示「数据 N 分钟前」，让过期看得见
   3) 页面隐藏时降频（10 分钟一次），省电
*/
(function(){
  var lastFetchAt = Date.now();
  var idleTimer = null;

  function refreshNow(){
    try{
      if (typeof load === 'function') { load(); }
      lastFetchAt = Date.now();
    }catch(refreshErr){ /* 静默：下次定时还会试 */ }
    try{
      if (typeof loadExtras === 'function') { loadExtras(); }
    }catch(extrasErr){ /* 同上 */ }
  }

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      var ageMs = Date.now() - lastFetchAt;
      if (ageMs > 60000) { refreshNow(); }
      if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
    } else {
      if (!idleTimer) { idleTimer = setInterval(refreshNow, 600000); }
    }
  });

  function humanAge(minutes){
    if (minutes < 1) { return '刚刚'; }
    if (minutes < 60) { return Math.floor(minutes) + ' 分钟前'; }
    var h = Math.floor(minutes / 60);
    if (h < 24) { return h + ' 小时' + Math.floor(minutes % 60) + ' 分前'; }
    return Math.floor(h / 24) + ' 天前';
  }

  function tickAgeLabel(){
    var genEl = document.getElementById('gen');
    if (!genEl) { return; }
    // 2026-11-05（F3 真实性）：实时层(state.json)与治理层(board.json)是两个数据源、
    // 两个时点。旧版拿治理板的时点冒充整页「数据年龄」→ 顶部显示「更新 10:03（实时）」
    // 同时显示「数据 10 小时前」（治理板冻结时点）—— 同屏自相矛盾。
    // 现在：两层各算各的、各自如实显示，整体颜色取**最旧的一层**。
    var parseTs = function(stamp){
      if(!stamp) return null;
      try{
        var n = String(stamp).replace('T',' ').replace(/[+-]\d{2}:\d{2}$/,'');
        var p = new Date(n.replace(' ','T'));
        return (p && !isNaN(p.getTime())) ? p.getTime() : null;
      }catch(e){ return null; }
    };
    var board = window.__extrasData || (window.__boardData || null);
    var stateMs = parseTs(window.__stateGeneratedAt || null);
    /* 2026-11-05 P0-3 收盘语义：收盘后仍写"实时 X 前"是误导。
       state.freshness.inSession=false 即已收盘 → 改写"收盘 · 下一交易日 09:15"。 */
    var inSession=true;
    try{
      var fz=(window.__stateData&&window.__stateData.freshness)||null;
      if(fz && fz.inSession===false) inSession=false;
    }catch(e){}
    var boardMs  = parseTs(board && (board.generatedAt || (board._freshness && board._freshness.checkedAt) || null));
    if (stateMs==null && boardMs==null) { return; }
    var stateMin = stateMs==null ? null : (Date.now()-stateMs)/60000;
    var boardMin = boardMs==null ? null : (Date.now()-boardMs)/60000;
    if (stateMin!=null && stateMin<0) stateMin=null;
    if (boardMin!=null && boardMin<0) boardMin=null;
    var worst = Math.max(stateMin==null?-1:stateMin, boardMin==null?-1:boardMin);
    if (worst < 0) { return; }
    var color = worst > 60 ? '#ff5c5c' : (worst > 15 ? '#ffb340' : '#7d8b9c');
    // 去掉上一轮追加的后缀，避免叠加
    var base = genEl.textContent.replace(/\s*·\s*(?:数据|实时|治理|收盘|快照)\s.*$/, '');
    genEl.innerHTML = '';
    genEl.appendChild(document.createTextNode(base));
    var parts = [];
    if(inSession){
      if(stateMin!=null) parts.push('实时 '+humanAge(stateMin));
    }else{
      parts.push('收盘 · 下一交易日 09:15');
    }
    if(boardMin!=null) parts.push('治理 '+humanAge(boardMin));
    var span = document.createElement('span');
    span.style.color = color;
    span.textContent = ' · ' + parts.join(' · ');
    genEl.appendChild(span);
  }

  setInterval(tickAgeLabel, 30000);
  setTimeout(tickAgeLabel, 2500);
  setTimeout(tickAgeLabel, 6000);
  window.addEventListener('online', refreshNow);
})();
</script>
