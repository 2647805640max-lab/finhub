<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FinHub · 投资驾驶舱</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS 加到主屏幕后：用这张当图标，用这个当名字（否则会拿页面截图当图标、标题被截断） -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="FinHub">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0a0e14; --card:#121820; --card2:#18202b; --line:#1f2a37;
  --txt:#e6edf3; --dim:#7d8b9c; --up:#f6465d; --dn:#0ecb81; --acc:#4c8dff;
  --warn:#f5a524; --ok:#0ecb81;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}
.brand{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand span{color:var(--acc)}
.ts{font-size:12px;color:var(--dim);text-align:right;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:10px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
  letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--dim);font-weight:400}
.hero{display:flex;align-items:center;gap:14px}
.badge{font-size:22px;font-weight:800;padding:8px 16px;border-radius:12px;letter-spacing:1px}
.badge.trim{background:rgba(246,70,93,.14);color:var(--up);border:1px solid rgba(246,70,93,.35)}
.badge.add{background:rgba(14,203,129,.14);color:var(--dn);border:1px solid rgba(14,203,129,.35)}
.badge.wait{background:rgba(125,139,156,.14);color:var(--dim);border:1px solid var(--line)}
.hero .meta{flex:1}
.hero .meta .stage{font-size:16px;font-weight:600}
.hero .meta .adv{font-size:12px;color:var(--dim);margin-top:2px}
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:8px;font-size:12px}
.bar .lab{width:52px;color:var(--dim)}
.bar .track{flex:1;height:7px;background:var(--card2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .6s}
.bar .val{width:38px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{background:var(--card2);border-radius:10px;padding:10px}
.q .n{font-size:12px;color:var(--dim)}
.q .p{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.q .c{font-size:12px;font-weight:600}
.up{color:var(--up)} .dn{color:var(--dn)} .fl{color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.f{display:flex;justify-content:space-between;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:none}
.f .k{font-size:13px}
.f .k small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.f .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.f .v small{display:block;font-size:11px;font-weight:400;margin-top:1px}
.na{color:var(--warn);font-size:15px}
.node{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0}
.node .id{width:30px;color:var(--acc);font-weight:600}
.node .jm{flex:1;color:var(--txt)}
.node .wt{width:46px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.node .wt i{display:block;height:100%;background:var(--acc);border-radius:3px}
.node .wv{width:34px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.concl{font-size:12.5px;color:#a9b6c4;line-height:1.65;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
.err{color:var(--warn);font-size:12px}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;
  background:var(--card2);color:var(--dim);margin-left:6px;vertical-align:1px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sum .s{background:var(--card2);border-radius:10px;padding:9px 10px}
.sum .s .n{font-size:11px;color:var(--dim)}
.sum .s .p{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.sum .s .p small{font-size:11px;font-weight:400;display:block;margin-top:1px}
.alrt{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.alrt:last-child{border-bottom:none}
.alrt .lv{font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(245,165,36,.14);
  color:var(--warn);white-space:nowrap;height:fit-content;margin-top:1px}
.alrt .m{flex:1;line-height:1.45}
.alrt .m small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.news{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.55}
.news:last-child{border-bottom:none}
.news b{font-size:13px;display:block;margin-bottom:3px;color:var(--txt)}
.news .fx{color:#93a1b1}
.news .fx em{font-style:normal;color:#5a6675}
.q .d{font-size:10px;color:#5a6675;margin-top:2px}
.sent{font-size:10px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:600}
.sent.bull{background:rgba(246,70,93,.14);color:var(--up)}
.sent.bear{background:rgba(14,203,129,.14);color:var(--dn)}
.sent.neu{background:var(--card2);color:var(--dim)}
.tags{font-size:10.5px;color:#7d8b9c;margin-top:3px}
/* 因子分层 */
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.fb{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card2)}
.fb.add{color:var(--up);border-color:rgba(246,70,93,.35);background:rgba(246,70,93,.12)}
.fb.del{color:var(--dn);border-color:rgba(14,203,129,.35);background:rgba(14,203,129,.12)}
.fb.nul{color:var(--dim)}
.arw{color:#4a5666;font-size:13px}
.vt{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:700;margin-left:4px;white-space:nowrap}
.vt.add{background:rgba(246,70,93,.14);color:var(--up)}
.vt.del{background:rgba(14,203,129,.14);color:var(--dn)}
.vt.nul{background:var(--card2);color:#5a6675}
.alrt .m b{font-size:13px;font-weight:600}
.rd{font-size:12px;color:var(--txt);margin-top:2px;font-variant-numeric:tabular-nums}
.rd em{font-style:normal;color:#5a6675;font-size:10.5px;margin-left:4px}
.corrbox{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cb-h{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;font-weight:600}
.cb-i{font-size:11.5px;color:#93a1b1;margin-top:5px;line-height:1.7}
/* 口令锁 */
.lock{border-color:rgba(245,165,36,.35)}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:9px;
  color:var(--txt);font-size:14px;padding:9px 10px;outline:none}
.row input:focus{border-color:var(--acc)}
.row button{background:var(--acc);color:#fff;border:none;border-radius:9px;
  padding:9px 16px;font-size:13px;font-weight:600}
/* 人工确认 / 审计留痕 */
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ab{font-size:11.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--card2);color:var(--dim);font-weight:600}
.ab.ok{color:var(--up);border-color:rgba(246,70,93,.3)}
.ab.no{color:var(--dn);border-color:rgba(14,203,129,.3)}
.ab:active{opacity:.6}
.au{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.au:last-child{border-bottom:none}
.au .dc{font-size:10px;padding:1px 6px;border-radius:5px;white-space:nowrap;height:fit-content;margin-top:1px}
.au .dc.confirm{background:rgba(246,70,93,.14);color:var(--up)}
.au .dc.reject{background:rgba(14,203,129,.14);color:var(--dn)}
.au .dc.defer,.au .dc.note{background:var(--card2);color:var(--dim)}
.au .t{flex:1;line-height:1.45}
.au .t small{display:block;color:#5a6675;font-size:10.5px;margin-top:1px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2a37;
  color:var(--txt);font-size:12.5px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.on{opacity:1}

.freshbar{margin:0 0 10px;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5}
.freshbar.ok{background:#12301f;border:1px solid #1d4b3a;color:#3ddc97}
.freshbar.warn{background:#33290f;border:1px solid #4b3d1d;color:#ffb340}
.freshbar.bad{background:#3a1717;border:1px solid #4b1d1d;color:#ff5c5c}
.nttbl{width:100%;border-collapse:collapse;font-size:12px}
.nttbl td{padding:4px 0;border-bottom:1px solid #1c2430}
.nttbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.xcard{margin:10px 0;padding:12px 14px;border:1px solid #1c2430;border-radius:12px;background:#0f151d}
.xcard h3{margin:0 0 8px;font-size:14px;color:#e6edf5}
.xnote{color:#7c8899;font-size:11px;line-height:1.5;margin-top:8px}
.xbtn{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-size:13px;border:0}

/* ── 单页模式切换（实时 / 治理）── */
#modebar{display:flex;gap:6px;margin:0 0 10px;padding:0 2px}
#modebar button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
  padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
#modebar button.on{background:var(--acc);border-color:var(--acc);color:#04101f}
#t2bar{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}
#golink,#t2bar .golink{color:var(--acc);font-size:12px;text-decoration:none;padding:4px 8px}
.t2toggle{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer}
.t2toggle input{accent-color:var(--acc)}
/* ② 一级屏收纳：tier2 卡默认收起，勾选「显示更多」或跳 board.html */
#app > .card.tier2{display:none}
body.showall #app > .card.tier2{display:block}
/* 持仓上传页 */
#page-hold .kvrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#page-hold label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
#page-hold input,#page-hold textarea{background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:8px 10px;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
#page-hold textarea{width:100%;resize:vertical;font-family:ui-monospace,"JetBrains Mono",Consolas,monospace}
#page-hold button{background:var(--acc);border:none;color:#04101f;padding:9px 16px;
  border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
#page-hold table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
#page-hold td{padding:5px 0;border-bottom:1px solid var(--line)}

/* ── 治理看板（board.html 合并进来的独有样式，全部限定在 #page-gov 内）── */
#page-gov{padding:4px 2px 8px}
#page-gov header{position:static;display:block;background:none;padding:12px 4px 8px}
#page-gov h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
#page-gov h1 small{font-weight:400;color:var(--dim);font-size:11px}
#page-gov .meta{color:var(--dim);font-size:11px;margin-top:4px}
#page-gov nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;-webkit-overflow-scrolling:touch}
#page-gov nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);
  padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;white-space:nowrap}
#page-gov nav button.on{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:600}
#page-gov .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:12.5px}
#page-gov .kv div:nth-child(odd){color:var(--dim)}
#page-gov .hops{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
#page-gov .hop{margin-bottom:10px;position:relative}
#page-gov .hop::before{content:"";position:absolute;left:-17px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
#page-gov .hop b{font-size:12.5px}
#page-gov .bar{display:block;height:6px;background:#0b1220;border-radius:3px;overflow:hidden;margin-top:4px}
#page-gov .bar>i{display:block;height:100%;background:var(--acc)}
#page-gov .ok{color:var(--ok)}
#page-gov .warn{color:var(--warn)}
#page-gov .bad{color:var(--bad)}
#page-gov .dim{color:var(--dim)}
#page-gov .num{text-align:right;font-variant-numeric:tabular-nums}
#page-gov .pill{border:1px solid var(--line);border-radius:4px;margin:0 4px 0 0;vertical-align:baseline}
#page-gov .pill.ok{color:var(--ok);border-color:#1d4b3a}
#page-gov .pill.warn{color:var(--warn);border-color:#4b3d1d}
#page-gov .pill.bad{color:var(--bad);border-color:#4b1d1d}
#page-gov .card{overflow-wrap:anywhere}
#page-gov th{color:var(--dim);font-weight:500;font-size:11px}
#page-gov td{padding:7px 6px;text-align:left}
#page-gov .err{color:var(--bad)}
#page-gov .installbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#0f1b2b;border:1px solid #1e3a5f;
  border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
#page-gov .installbar button{background:var(--acc);border:0;color:#04101f;font-weight:600;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer}
#page-gov .installbar button:disabled{background:#1e2a3a;color:var(--dim);cursor:default}
#page-gov .installbar .dim{font-size:11px}
#page-gov .reload{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
#page-gov .govfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;
  margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
@media (max-width:560px){
  #page-gov .kv{grid-template-columns:88px 1fr}
  #page-gov table,#page-gov thead,#page-gov tbody,#page-gov tr,#page-gov td,#page-gov th{display:block;width:auto}
  #page-gov thead{display:none}
  #page-gov tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#0d141e}
  #page-gov td{border:0;padding:3px 0}
  #page-gov td.num{text-align:left}
  #page-gov td:first-child{font-size:13px}
}

/* ── 双横幅修复：治理页内部横幅隐藏，只保留顶部 #freshbar ── */
#page-gov #govfreshbar, #govfreshbar{ display:none !important; }
#marketbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-variant-numeric:tabular-nums}
#marketbar .mk{white-space:nowrap}
#marketbar .mk b{font-weight:600}
#marketbar .up{color:#ff5c5c}
#marketbar .dn{color:#2ecc71}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Fin<span>Hub</span></div>
    <div class="ts"><div id="now">--:--</div><div id="gen" style="color:#5a6675"></div></div>
  </header>
  <div id="freshbar" class="freshbar" hidden></div>
  <div id="marketbar" class="freshbar marketbar" hidden></div>
  <div id="autobar" class="freshbar" hidden></div>
  <nav id="modebar">
    <button data-page="live" class="on">实时</button>
    <button data-page="gov">治理</button>
    <button data-page="hold">持仓上传</button>
    <span id="t2bar"><a href="board.html" class="golink">详情看板 →</a>
      <label class="t2toggle"><input id="t2show" type="checkbox">显示更多</label></span>
  </nav>
  <div id="page-live">
    <div id="app"><div class="card"><span class="err">加载中…</span></div></div>
  </div>
  <div id="page-hold" hidden>
    <div class="card">
      <h2>持仓快照上传 <span class="tag">粘贴文本 → VPS 校验 → PC 回拉 finwatch</span></h2>
      <div class="note">每行一个标的：<code>名称 | 代码 | 市值（元）| 类型（可选）| 板块/备注（可选）</code>。同一平台一次传完；金额校验 &gt;0、名称必填。</div>
      <div class="kvrow">
        <label>数据日 <input id="hdate" type="date"></label>
        <label>平台 <input id="hplat" placeholder="支付宝 / 券商 / 银行理财…" maxlength="40"></label>
        <label>现金（元，可空）<input id="hcash" type="number" min="0" step="0.01" placeholder="0.00"></label>
      </div>
      <textarea id="htext" rows="9" spellcheck="false"
        placeholder="黄金ETF联接C | 002963 | 12038.04 | fund | 黄金&#10;安鑫最低持有360天 |        | 6013.11 | fund | 银行理财"></textarea>
      <div class="row" style="margin-top:8px;display:flex;gap:8px">
        <button id="hsubmit" style="flex:1">提交到 VPS</button>
        <button id="hclear" style="flex:0 0 auto">清空</button>
      </div>
      <div class="note" id="hmsg"></div>
      <div id="hpreview"></div>
      <div class="note">提交成功后：VPS 立即落盘并写留痕；PC 下一轮采集（30 分钟内）自动回拉到本地 <code>~/.dsh/finwatch/holdings.json</code>。失败行会在这里红标，绝不落半成品。</div>
    </div>
  </div>
  <div id="page-gov" hidden>
    <div id="govfreshbar" class="freshbar" hidden></div>
    <header>
      <h1>治理看板 <small id="govVer">—</small></h1>
      <div class="meta" id="govGen">等待 board.json …</div>
    </header>
    <nav id="govnav">
      <button data-t="today" class="on">今日简报</button>
      <button data-t="ips">配置仪表</button>
      <button data-t="factor">因子信号</button>
      <button data-t="news">新闻事件</button>
      <button data-t="chain">推演假设</button>
      <button data-t="watch">观察清单</button>
      <button data-t="audit">审计留痕</button>
      <button data-t="nt">国家队</button>
      <button data-t="settings">设置</button>
    </nav>
    <section id="s-today"></section>
    <section id="s-ips" hidden></section>
    <section id="s-factor" hidden></section>
    <section id="s-news" hidden></section>
    <section id="s-chain" hidden></section>
    <section id="s-audit" hidden></section>
    <section id="s-watch" hidden></section>
    <section id="s-nt" hidden></section>
    <section id="s-settings" hidden></section>
    <div class="govfoot">
      <span id="govSrc">board.json（由 index-remote 的 loadExtras 注入）</span>
      <button class="reload" id="govReloadBtn">刷新</button>
    </div>
  </div>
</div>
<script>
const pick=s=>document.querySelector(s);
const cls=v=>v>0?'up':(v<0?'dn':'fl');
const signedPct=v=>(v>0?'+':'')+v.toFixed(2)+'%';
const num=(v,d=2)=>v==null?'—':Number(v).toFixed(d);

/* 基线数据源：jsDelivr 的 @main 会在推送后很快刷新，raw.githubusercontent 的 main 分支
   会被 CDN 缓存好几分钟（实测 5 分钟以上）——两个都试，先到先得。 */
const DATA_REMOTES=[
  'https://cdn.jsdelivr.net/gh/2647805640max-lab/finhub-data@main/state.json',
  'https://raw.githubusercontent.com/2647805640max-lab/finhub-data/main/state.json'
];
const DATA_LOCAL='data/state.json';
let lastSource='';
/* 2026-11-04 ② 源选择与通告：
   - 快照多源（jsDelivr / raw.github / Pages 自托管）不再"先到先得"，按 ts 取最新的那个：
     jsDelivr 的 @main 可被 CDN 缓存 10h+，先到先得会把锁在旧数据上，而头部时间戳又来自
     另一份契约，造成「更新 21:44 · 数据 8 分钟前」与正文 11:29 的静默错位。
   - 头部 lastSource 会带「快照 源 时点」，实时源与快照源各自的 asOf 同时可见。 */
let snapAsOf={};   // 每个源取到的 ts（已格式化）
let snapSrc='';    // 实际被选中的源名
function fmtTime(ts){
  try{ const d=new Date(ts); if(!ts||isNaN(d)) return '—';
    const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){ return '—'; }
}
let lastAudit=[];      // 最近审计留痕
let lastRoot='';       // 当前隧道根地址
let lockState='';      // '' | nokey | bad | offline

/* 个人层口令：只存这台设备的 localStorage，不写进代码、不进公开仓库 */
const KEY_STORE='fh_key';
const getKey=()=>localStorage.getItem(KEY_STORE)||'';

async function jget(u,auth){
  const h={};
  if(auth&&getKey()) h['X-FH-Key']=getKey();
  const r=await fetch(u,{cache:'no-store',headers:h});
  if(r.status===401){const e=new Error('口令不对');e.code=401;throw e;}
  if(r.status===429){const e=new Error('尝试过多，稍后再试');e.code=429;throw e;}
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j || !j.generatedAt) throw new Error('数据为空');
  return j;
}

/* 审计日志是 JSONL，单独按文本取最后若干条 */
async function auditRecent(root){
  if(!root||!getKey()) return [];
  try{
    const r=await fetch(root+'/data/audit.jsonl?_='+Date.now(),
      {cache:'no-store',headers:{'X-FH-Key':getKey()}});
    if(!r.ok) return [];
    const t=await r.text();
    return t.trim().split('\n').filter(Boolean).slice(-6).reverse()
      .map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
  }catch(e){ return []; }
}

async function load(){
  const bust='_='+Date.now();
  let base=null, err=null;
  /* 1) 基线：本机页面优先读本地完整快照；手机读 GitHub raw（含 tunnelUrl） */
  const IS_LOCAL=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  const SOURCES=IS_LOCAL?[DATA_LOCAL,...DATA_REMOTES]:[...DATA_REMOTES,DATA_LOCAL];
  /* 2026-11-04 ②：逐源请求、按 ts 取最新（同 ts 先到者胜）；每个源的时点记进 snapAsOf */
  const tsof=o=>{ if(!o) return 0; if(o.ts!=null&&!isNaN(Number(o.ts))) return Number(o.ts);
                  const t=Date.parse(String(o.generatedAt||'').replace(' ','T')); return isNaN(t)?0:t; };
  const srcname=u=>u.indexOf('cdn.jsdelivr')>=0?'jsDelivr':
                   (u.indexOf('raw.githubusercontent')>=0?'raw.github':'pages');
  let bestTsVal=-1;
  for(const u of [...SOURCES.map(x=>x+'?'+bust)]){
    try{
      const c=await jget(u);
      const t=tsof(c);
      snapAsOf[srcname(u)]=t?fmtTime(t):'—';
      if(!base || t>bestTsVal){ base=c; bestTsVal=t; snapSrc=srcname(u); }
    }catch(e){ err=e; }
  }
  if(!base){
    pick('#app').innerHTML='<div class="card"><span class="err">读取失败：'+(err?err.message:'无数据')+'</span></div>';
    return;
  }

  /* 2) 有隧道地址就直连拿实时（不走 CDN 缓存）
        分层：公开仓库只有市场层；持仓/新闻/告警/链式推演属于个人层，
        只在隧道上（/data/personal.json），且需要口令，绝不回落成公开数据。 */
  let data=base, src='缓存', personalOK=false;
  lockState='';
  lastRoot=base.tunnelUrl?base.tunnelUrl.replace(/\/+$/,''):'';
  if(base.tunnelUrl){
    try{
      const live=await jget(lastRoot+'/data/state.json?'+bust);
      if(!base.ts || (live.ts||0)>=(base.ts||0)){ data=Object.assign({},base,live); src='实时'; }
    }catch(e){}
    if(base.holdings&&base.holdings.assets){
      /* 本机页面（localhost）的 data/state.json 自带个人层，不需要口令 */
      personalOK=true;
    }else if(getKey()){
      try{
        const per=await jget(lastRoot+'/data/personal.json?'+bust, true);
        if(per&&typeof per==='object'){ data=Object.assign({},data,per); personalOK=true; }
      }catch(e){ lockState=(e.code===401||e.code===429)?'bad':'offline'; }
    }else{ lockState='nokey'; }
    lastAudit=await auditRecent(lastRoot);
  }
  data.__personalOK=personalOK;
  if(!data.tunnelUrl) data.tunnelUrl=base.tunnelUrl;
  /* 2026-11-04 ②：lastSource 带上快照源与时点，实时/快照两个 asOf 同屏可见 */
  lastSource=src+(snapSrc&&snapAsOf[snapSrc]&&snapAsOf[snapSrc]!=='—'
    ?('（快照 '+snapSrc+' '+snapAsOf[snapSrc]+'）'):'')
    +(personalOK?'':' · 个人层未解锁');
  /* 暴露给持仓上传 IIFE 的近端状态：隧道根 + 口令 getter */
  try{
    window.__fhLastRoot=lastRoot;
    window.__fhKeyGet=getKey;
  }catch(e){}

  render(data);
  loadExtras();
}

function render(s){
  const e=s.engine||{}, sc=e.scores||{}, m=s.market||{}, b=s.bonds||{}, c=s.commodity||{};
  const act=(e.marketAction||'WAIT');
  const actCls=act==='TRIM'||act==='EXIT'?'trim':(act==='ADD'?'add':'wait');
  const actCN={ADD:'加仓窗口',TRIM:'减仓',EXIT:'撤离',WAIT:'观望'}[act]||act;
  let h='';

  /* 个人层口令锁 */
  if(lockState){
    const msg=lockState==='bad'?'口令不对（或尝试过多）。重新输入：'
      :(lockState==='offline'?'隧道暂时读不到个人层，稍后自动重试。也可以重新输入口令：'
      :'持仓 / 告警 / 新闻 / 链式推演在隧道上，需要口令才能读。公开仓库里没有这些数据。');
    h+=`<div class="card lock">
      <h2>个人层${lockState==='bad'?'未解锁':'已锁定'} <span class="tag">本机保存 · 不进仓库</span></h2>
      <div class="note">${msg}</div>
      <div class="row"><input id="kin" type="password" placeholder="口令" autocomplete="off" autocapitalize="off">
        <button id="kbtn">解锁</button></div>
      <div class="note" id="kmsg"></div>
    </div>`;
  }

  /* 日频信号卡：一天一版，因子按收盘算，盘中不重算 */
  const dsv=s.daily_signal||{};
  if(dsv.signal){
    const dailySig=dsv.signal, dv=dsv.deviation||{}, fz=dsv.freshness||{};
    const dcls={ADD:'add',TRIM:'trim',EXIT:'trim',WAIT:'wait'}[dailySig.action]||'wait';
    const dcn={ADD:'加仓窗口',TRIM:'减仓',EXIT:'撤离',WAIT:'观望'}[dailySig.action]||dailySig.action;
    const money=x=>x==null?'—':Math.round(x).toLocaleString('zh-CN');
    h+=`<div class="card">
      <h2>今日信号卡 <span class="tag">日频 ${dsv.date||'—'} · ${(dsv.builtAt||'').slice(11,16)}</span></h2>
      <div class="hero">
        <div class="badge ${dcls}">${dcn}</div>
        <div class="meta">
          <div class="stage">${dailySig.stage||'—'} <span class="pill">机会 ${dailySig.opportunity??'—'} / 风险 ${dailySig.risk??'—'}</span></div>
          <div class="adv">信心 ${dailySig.confidence||'—'}${fz.incomplete?' · <span style="color:var(--warn)">数据缺口已降档</span>':''}</div>
        </div>
      </div>
      <div class="bars">
        ${bar('风险敞口',dv.riskPct,100,'var(--up)')}
        ${bar('目标 20%',20,100,'#5a6675')}
      </div>
      <div class="note">总资产 ${money(dv.total)} · 风险 ${money(dv.risk)}（${dv.riskPct??'—'}%）· 回到 20% 需减 ${money(dv.trimNeeded)}</div>
      ${(dsv.checklist||[]).map(x=>`<div class="concl">· ${x}</div>`).join('')}
      <div class="note">频率与失效条件绑定：每个因子登记了「超过 X 小时未更新即无效」，失效因子强制不投票。行情卡另有刷新周期。</div>
    </div>`;
  }

  /* 大盘裁决 */
  h+=`<div class="card">
    <h2>大盘裁决 <span class="tag">引擎 · 收盘序列</span></h2>
    <div class="hero">
      <div class="badge ${actCls}">${actCN}</div>
      <div class="meta">
        <div class="stage">${e.mainStage||'—'} <span class="pill">一致率 ${e.stageAgreement!=null?(e.stageAgreement*100).toFixed(0)+'%':'—'}</span></div>
        <div class="adv">${e.advice||''}</div>
      </div>
    </div>
    <div class="bars">
      ${bar('机会分',sc.opportunity,100,'var(--dn)')}
      ${bar('风险分',sc.risk,100,'var(--up)')}
      <div class="bar"><span class="lab">投票</span><span class="track" style="background:none;
        color:var(--dim);font-size:11.5px;height:auto">加仓 ${e.votes?.add??0}/${e.votes?.n??4} · 跑路 ${e.votes?.run??0}/${e.votes?.n??4}</span></div>
    </div>
    ${actBtns('engine',"裁决 "+actCN+" "+s.generatedAt)}
  </div>`;

  /* 因子分层：因果层（进裁决）/ 相关层（只进评分） */
  const ca=s.causal||{};
  if(ca.factors){
    const voteChip=v=>v>0?'<span class="vt add">+1 票</span>':(v<0?'<span class="vt del">−1 票</span>':'<span class="vt nul">0 票</span>');
    const actCN2=a=>({ADD:'加仓',TRIM:'减仓',EXIT:'撤离',WAIT:'观望'}[a]||a||'—');
    h+=`<div class="card">
      <h2>因子分层 <span class="tag">因果进裁决 · 相关只评分</span></h2>
      <div class="flow">
        <span class="fb ${ca.baseAction==='ADD'?'add':(ca.baseAction==='WAIT'?'nul':'del')}">引擎 ${actCN2(ca.baseAction)}</span>
        <span class="arw">→</span>
        <span class="fb ${ca.finalAction==='ADD'?'add':(ca.finalAction==='WAIT'?'nul':'del')}">因果修正 ${actCN2(ca.finalAction)}</span>
        <span class="pill">${ca.changed?'已改判':'未改判'} · 信心 ${ca.confidence||'—'}</span>
      </div>`;
    ca.factors.forEach(f=>{
      h+=`<div class="alrt">
        <span class="lv" style="background:var(--card2);color:var(--acc)">${f.id}</span>
        <div class="m"><b>${f.name}</b> ${voteChip(f.vote)}
          <div class="rd">${f.read}${f.asof?' <em>'+f.asof+'</em>':''}</div>
          <small>机制：${f.mechanism}</small>
          <small>证据：${f.evidence}</small>
          ${f.divergence?`<small style="color:var(--warn)">背离：${f.divergence}</small>`:''}
          ${f.staleNote?`<small style="color:var(--warn)">${f.staleNote}</small>`:''}
        </div></div>`;
    });
    const cr=ca.correlation||{};
    if((cr.items||[]).length){
      h+=`<div class="corrbox">
        <div class="cb-h">相关层综合评分（只进评分，不投票）<span class="${cls(cr.score)}">${cr.score==null?'—':(cr.score>0?'+':'')+cr.score}</span></div>
        <div class="note">${cr.note||''}　明细见下方「相关层因子」卡。</div>
      </div>`;
    }
    if((ca.notes||[]).length){
      h+=`<div class="concl">${ca.notes.map(n=>'· '+n).join('<br>')}</div>`;
    }
    h+=`<div class="note">规则：因果因子须同时满足「有可命名传导机制」+「历史样本方向可复现」，才允许改 action；相关因子只描述风险偏好。历史证据每周重算（n=样本数，20 交易日窗口，未扣成本）。</div></div>`;
  }

  /* 数据新鲜度：每个因子是否在失效阈值内 */
  /* 2026-11-04 ②：年龄在浏览器端按当前时间重算，不再用生成时烘进 JSON 的 ageHours——
     那个值永远停在快照时刻，会把「0h 有效」一直挂到 10 小时后；负数（asOf 晚于
     generatedAt 的时点超前）也如实展示。 */
  const fzv=s.freshness||{};
  if((fzv.items||[]).length){
    const nowMs=Date.now();
    const ageOf=x=>{ if(!x) return null; const p=Date.parse(String(x).replace(' ','T'));
                     return isNaN(p)?null:(nowMs-p)/36e5; };
    let vCnt=0; const rows=[];
    fzv.items.forEach(i=>{
      const a=ageOf(i.asof);
      const stale=(a==null)||i.limitHours==null||(a>i.limitHours);
      if(!stale) vCnt++;
      rows.push({i, stale, label:(a==null)?'—':(a<0?'超前':a.toFixed(1)+'h')});
    });
    h+=`<div class="card"><h2>数据新鲜度 <span class="tag">${vCnt}/${fzv.items.length} 有效${fzv.incomplete?' · 有硬缺口':''} <small>（按当前时间重算）</small></span></h2>`;
    if((fzv.gaps||[]).length){
      h+=`<div class="concl" style="color:var(--warn)">${fzv.gaps.map(g=>'· '+g.name+'：'+g.reason).join('<br>')}</div>`;
    }
    h+='<table>';
    rows.forEach(r=>{
      const c=r.stale?'var(--warn)':'var(--dim)';
      h+=`<tr><td>${r.stale?'⚠️':'✅'} ${r.i.name}</td>
        <td style="text-align:right;color:${c}">${r.i.asof||'—'}</td>
        <td style="text-align:right;color:${c}">${r.label}</td>
        <td style="text-align:right;color:#5a6675">${r.i.limitHours}h</td></tr>`;
    });
    h+='</table><div class="note">阈值写在 factor_registry.py。超过阈值的因子被强制归零票，不再冒充新信号；缺口同时写入 data/gaps.jsonl 留痕。年龄列 = 当前时间 − asOf，浏览器每 60 秒重算。</div></div>';
  }

  const f2=b.F2||{},f3=b.F3||{},oil=c.OIL||{},cl=c.CL||{},xau=c.XAU||{};
  const d2=f2.value!=null&&f2.prev!=null?(f2.value-f2.prev).toFixed(4):null;
  const d3=f3.value!=null&&f3.prev!=null?(f3.value-f3.prev).toFixed(2):null;
  h+=`<div class="card">
    <h2>三因子 <span class="tag">收盘 ${b.asof||'—'}</span></h2>
    <div class="f"><div class="k">F1 布伦特（ICE Dec-2026）
      <small>锁定口径 · 今日结算价未产生</small></div>
      <div class="v na">未取得<small>见下方盘中观测</small></div></div>
    <div class="f"><div class="k">F2 中国10年期国债
      <small>10Y−2Y 利差 ${num(f2.spread,4)}${f2.date&&f2.date!==b.asof?' · 数据日 '+f2.date:''}</small></div>
      <div class="v">${num(f2.value,4)}%<small class="${d2>0?'up':(d2<0?'dn':'fl')}">${d2>0?'+':''}${d2??'—'} bp</small></div></div>
    <div class="f"><div class="k">F3 美国30年期国债
      <small>美10Y ${num(f3.us10y,2)}%${f3.date&&f3.date!==b.asof?' · 数据日 '+f3.date:''}</small></div>
      <div class="v">${num(f3.value,2)}%<small class="${d3>0?'up':(d3<0?'dn':'fl')}">${d3>0?'+':''}${d3??'—'} bp</small></div></div>
    <div class="note">口径纪律：F1 必须是 ICE Brent Dec-2026 官方结算价，近月 Jan-2027 报价不得冒充。下方为盘中 tick，仅供方向参考。</div>
    ${(()=>{const y=(s.causal||{}).yields;if(!y||!y.record)return '';
      const r=y.record,c=y.check;
      return `<div class="note">美债10Y 唯一记录源：${r.src} ${r.value}%（${r.date}）${c?` · 交叉校验 ${c.src} ${c.value}%（${c.date}）→ ${y.verdict||''}`:' · 交叉校验源本轮未取到'}</div>`;})()}
  </div>`;

  /* 盘中观测 */
  h+=`<div class="card">
    <h2>盘中观测 <span class="tag">非判定口径</span></h2>
    <div class="grid">
      ${quadCell('Brent 近月 Jan-2027',oil.price,oil.chgPct)}
      ${quadCell('WTI Dec-2026',cl.price,cl.chgPct)}
      ${quadCell('伦敦金现货',xau.price,xau.chgPct)}
      ${quadCell('黄金ETF',(m.watch||[]).find(w=>w.code==='sh518880')?.price,(m.watch||[]).find(w=>w.code==='sh518880')?.chgPct)}
    </div>
  </div>`;

  /* 扩展因子（参考，不进裁决） */
  const ex=s.expanded||{};
  if((ex.items||[]).length){
    h+=`<div class="card"><h2>相关层因子 <span class="tag">只进评分 · 不投票</span></h2><div class="grid">`;
    ex.items.forEach(r=>{
      h+=`<div class="q"><div class="n">${r.name}</div>
        <div class="p">${r.kind==='fut'?num(r.price,0):num(r.price,2)}</div>
        <div class="c ${cls(r.chgPct)}">${r.chgPct==null?'—':signedPct(r.chgPct)}</div>
        ${r.asof?`<div class="d">${r.asof}</div>`:''}</div>`;
    });
    h+=`</div><div class="note">指数取海外源（Yahoo，含 KOSPI）最近价；碳酸锂·玻璃·豆粕为主力连续，按昨结算算涨跌。这些只有「一起动」的历史，没有稳定传导机制，所以只进评分、不投票。</div></div>`;
  }

  /* 海外宏观（洛杉矶直连） */
  const ov=s.overseas||{};
  const fr=(ov.fred||{}).items||[];
  const fedChg=(ov.fedChanges||[]);
  if(fr.length){
    const lastFed=fedChg.length?fedChg[fedChg.length-1]:null;
    h+=`<div class="card"><h2>海外宏观 <span class="tag">VPS 直连 · 参考</span></h2><div class="grid">`;
    fr.forEach(r=>{
      h+=`<div class="q"><div class="n">${r.name}</div>
        <div class="p">${num(r.value,2)}<span style="font-size:12px">%</span></div>
        <div class="c ${cls(r.chg==null?null:-r.chg)}">${r.chg==null?'—':(r.chg>0?'+':'')+num(r.chg,2)+'pp'}</div>
        <div class="d">${r.asof||''}</div></div>`;
    });
    h+=`</div>`;
    if(lastFed){
      const d=Math.round((Date.now()-new Date(lastFed.effective+'T00:00:00+08:00').getTime())/86400000);
      h+=`<div class="note">Fed 最近一次目标区间变动：${lastFed.effective} 生效 ${lastFed.bp>0?'+':''}${lastFed.bp}bp → 区间 ${lastFed.level}，距今 ${d} 天。表由 Fed 官网 openmarket.htm 自动更新，不再手工维护。</div>`;
    }
    h+=`</div>`;
  }

  /* 四大指数 */
  h+=`<div class="card"><h2>四大指数 <span class="tag">实时</span></h2><table>`;
  (m.indices||[]).forEach(i=>{
    h+=`<tr><td>${i.name}</td><td class="r">${num(i.price,2)}</td>
        <td class="r ${cls(i.chgPct)}">${signedPct(i.chgPct)}</td></tr>`;
  });
  h+=`</table></div>`;

  /* 持仓相关 ETF */
  h+=`<div class="card"><h2>持仓板块 ETF <span class="tag">实时</span></h2><table>`;
  (m.watch||[]).forEach(w=>{
    h+=`<tr><td>${w.name}<span class="pill">${w.code.replace('sh','').replace('sd','')}</span></td>
        <td class="r">${num(w.price,3)}</td>
        <td class="r ${cls(w.chgPct)}">${signedPct(w.chgPct)}</td></tr>`;
  });
  h+=`</table></div>`;

  /* 持仓总览（真实账户） */
  const hd=s.holdings||{};
  if(hd.error){
    h+=`<div class="card"><h2>我的持仓 <span class="tag">读取失败</span></h2>
        <div class="err">${hd.error}</div></div>`;
  }else if(!hd.assets && s.__personalOK===false){
    h+=`<div class="card"><h2>我的持仓 <span class="tag">未连接</span></h2>
        <div class="note">持仓/告警/新闻属于个人层，只通过 VPS 隧道传输，不放在公开仓库。
        当前隧道未连通，所以看不到 —— 这是有意设计，不是数据丢了。电脑端与 VPS 恢复后自动出现。</div></div>`;
  }else{
    const pnlCls=cls(hd.totalPnl);
    h+=`<div class="card">
      <h2>我的持仓 <span class="tag">快照 ${hd.asof||'—'}</span></h2>
      <div class="sum">
        <div class="s"><div class="n">总资产（市值+现金）</div>
          <div class="p">${num(hd.assets,0)}</div></div>
        <div class="s"><div class="n">浮动盈亏</div>
          <div class="p ${pnlCls}">${hd.totalPnl==null?'—':(hd.totalPnl>0?'+':'')+num(hd.totalPnl,0)}
          <small class="${pnlCls}">${hd.totalPnlPct==null?'':(hd.totalPnlPct>0?'+':'')+num(hd.totalPnlPct,2)+'%'}</small></div></div>
      </div>
      <table>`;
    (hd.platforms||[]).forEach(p=>{
      h+=`<tr><td>${p.platform}<span class="pill">${p.date||''}</span></td>
          <td class="r">${num(p.mv,0)}</td>
          <td class="r ${cls(p.pnl)}">${p.pnl==null?'—':(p.pnl>0?'+':'')+num(p.pnl,0)}</td></tr>`;
    });
    h+=`<tr><td style="color:var(--dim)">现金合计</td><td class="r">${num(hd.totalCash,0)}</td><td class="r fl">—</td></tr>`;
    h+=`</table>`;
    h+=`<h2 style="margin-top:14px">Top 持仓 <span class="tag">共 ${hd.nPositions||(hd.positions||[]).length||0} 只</span></h2><table>`;
    (hd.positions||[]).slice(0,8).forEach(p=>{
      h+=`<tr><td>${p.name}</td><td class="r">${num(p.mv,0)}</td>
          <td class="r ${cls(p.pnlPct)}">${p.pnlPct==null?'<span class="fl">—</span>':signedPct(p.pnlPct)}</td></tr>`;
    });
    h+=`</table><div class="note">市值/成本来自 finwatch 最新快照（非实时净值）。盈亏仅统计有成本记录的持仓${hd.costCoveragePct!=null?`（覆盖市值 ${hd.costCoveragePct}%）`:''}。</div></div>`;
  }

  /* 告警 */
  const al=s.alerts||{};
  if((al.items||[]).length){
    h+=`<div class="card"><h2>告警 <span class="tag">累计 ${al.total||0} 条</span></h2>`;
    al.items.forEach(a=>{
      h+=`<div class="alrt"><span class="lv">${a.level||'提示'}</span>
        <div class="m">${a.msg||''}${a.action?`<small>${a.action}</small>`:''}
        <small>${a.ts} · ${a.rule||''}</small></div></div>`;
    });
    h+=`</div>`;
  }

  /* 每日新闻摘要（含 AI 打分，只展示不参与裁决） */
  const nw=s.news||{}, ns=s.newsscore||{};
  const scmap={};
  (ns.items||[]).forEach(x=>{ scmap[x.n]=x; });
  if((nw.items||[]).length){
    const net=ns.net;
    const netTxt=net==null?'':`AI 净情绪 ${net>0?'+':''}${net.toFixed(1)}`;
    h+=`<div class="card"><h2>每日新闻 <span class="tag">${nw.date||'—'}${netTxt?' · '+netTxt:''}</span></h2>`;
    nw.items.forEach(n=>{
      const x=scmap[n.n]||{};
      const scls=x.s>0?'bull':(x.s<0?'bear':'neu');
      const slabel=x.s>0?'利好':(x.s<0?'利空':'中性');
      h+=`<div class="news"><b>${n.n}. ${n.title}${x.s!=null?`<span class="sent ${scls}">${slabel}</span>`:''}</b>
        ${n.fact?`<div class="fx">${n.fact}</div>`:''}
        ${(x.sectors&&x.sectors.length)?`<div class="tags">${x.sectors.join(' · ')}${x.why?' — '+x.why:''}</div>`:''}</div>`;
    });
    h+=`<div class="note">${ns.error?'AI 打分失败：'+ns.error+'。':'打分为 AI 方向性判断，只做参考，不参与引擎裁决。'}只摘「事实」段，全文见 PC 端 daily-news/digest_${nw.date||''}.md</div></div>`;
  }else if(nw.error){
    h+=`<div class="card"><h2>每日新闻 <span class="tag">未取到</span></h2><div class="err">${nw.error}</div></div>`;
  }

  /* 突发观察：三层降噪后只剩假设卡 + 观察清单，永不改 action */
  const bu=s.burst||{};
  if(bu.builtAt){
    const cl=bu.cluster||{}, cards=bu.cards||[], wl=bu.watchlist||[];
    h+=`<div class="card"><h2>突发观察 <span class="tag">${bu.incomplete?'数据不完整 · 已抑制':'三层降噪'} · ${(bu.builtAt||'').slice(11,16)}</span></h2>`;
    h+=`<div class="note">轮询 ${bu.poll&&bu.poll.ok?'正常':'失败'} · 新条目 ${bu.poll&&bu.poll.newItems||0} · 窗口 ${cl.windowHours||6}h 内 ${cl.recent||0} 条 · 候选集群 ${(cl.clusters||[]).length} 个</div>`;
    if((cl.clusters||[]).length){
      h+=`<div class="tags">${cl.clusters.map(x=>`${x.keyword}×${x.n}`).join(' · ')}</div>`;
    }
    cards.forEach(x=>{
      h+=`<div class="alrt"><span class="lv" style="background:var(--card2);color:var(--acc)">假设</span>
        <div class="m"><b>${x.event}</b> <span class="pill">${x.confidence} · ${x.clusterDocs||0} 条</span>
        <div class="rd">${x.hypothesis}</div>
        <small>验证用：${(x.verifyWith||[]).join(' / ')||'—'}</small>
        <small style="color:var(--warn)">${x.action}</small></div></div>`;
    });
    wl.slice(0,6).forEach(x=>{
      h+=`<div class="alrt"><span class="lv" style="background:var(--card2);color:#5a6675">观察</span>
        <div class="m"><b>${x.event}</b> <span class="pill">${x.confidence}</span>
        <div class="rd">${x.note||''}${(x.keywords||[]).length?' · '+x.keywords.join('/'):''}</div></div></div>`;
    });
    h+=`<div class="note">规则：单条快讯永不触发推演；命中字典且集群密度够才生成假设卡；假设卡只写「该看哪个数据」，不改仓。</div></div>`;
  }

  /* 链式推演 */
  const ch=s.chain||{};
  h+=`<div class="card">
    <h2>链式推演 <span class="tag">${ch.logDate||'—'}</span></h2>`;
  (ch.nodes||[]).forEach(n=>{
    h+=`<div class="node"><span class="id">${n.node}</span><span class="jm">${n.judgement}</span>
        <span class="wt"><i style="width:${(n.weight*100).toFixed(0)}%"></i></span>
        <span class="wv">${n.weight!=null?n.weight.toFixed(2):'—'}</span></div>`;
  });
  if(ch.conclusion) h+=`<div class="concl">${ch.conclusion}</div>`;
  h+=`${actBtns('chain','推演 '+(ch.logDate||''))}</div>`;

  /* 人工确认留痕（只在解锁后显示） */
  if(lastAudit.length){
    const cnt={'confirm':0,'reject':0,'defer':0,'note':0};
    lastAudit.forEach(a=>{ if(cnt[a.decision]!=null) cnt[a.decision]++; });
    h+=`<div class="card"><h2>确认留痕 <span class="tag">最近 ${lastAudit.length} 条 · 存 VPS</span></h2>`;
    lastAudit.forEach(a=>{
      h+=`<div class="au"><span class="dc ${a.decision}">${a.label||a.decision}</span>
        <div class="t">${a.ref?a.ref+' · ':''}${a.item}
        ${a.note?`<small>备注：${a.note}</small>`:''}<small>${a.ts}</small></div></div>`;
    });
    h+=`<div class="note">这些记录只写 VPS 的 audit.jsonl（需口令可读），不进公开仓库。用来看「当时怎么判的、后来对没对」——推演命中率以后就从这里算。</div></div>`;
  }

  pick('#app').innerHTML=h;
  /* 2026-11-04 ② 一级屏收纳：默认只保留「大盘裁决」「个人层」两张卡；
     其余卡标 tier2 折叠——展开开关在 modebar（显示更多），或直接跳 board.html 详情看板。
     关键信息不缺：header 行情条 + _freshness 绿横幅 + 大盘裁决本身都在。 */
  try{
    const keep=/^(大盘裁决|个人层)/;
    [...pick('#app').querySelectorAll(':scope > div.card')].forEach(c=>{
      const t=(c.querySelector('h2')||{}).textContent||'';
      if(!keep.test(t)) c.classList.add('tier2');
    });
  }catch(e){}
  pick('#gen').textContent='更新 '+s.generatedAt+(lastSource?' · '+lastSource:'');
  document.getElementById('now').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
function bar(lab,v,max,col){
  const pct=Math.max(0,Math.min(100,(v||0)/max*100));
  return `<div class="bar"><span class="lab">${lab}</span>
    <span class="track"><i class="fill" style="width:${pct}%;background:${col}"></i></span>
    <span class="val">${v==null?'—':v.toFixed(1)}</span></div>`;
}
function quadCell(n,p,c){
  return `<div class="q"><div class="n">${n}</div>
    <div class="p">${p==null?'—':Number(p).toFixed(2)}</div>
    <div class="c ${cls(c)}">${c==null?'—':signedPct(c)}</div></div>`;
}
/* 人工确认按钮：只在个人层解锁后可用（写 VPS 审计日志需要口令） */
function actBtns(item,ref){
  if(!getKey()||lockState) return `<div class="note">解锁后可记录「确认 / 否决 / 备注」。</div>`;
  return `<div class="acts" data-item="${item}" data-ref="${(ref||'').replace(/"/g,'')}">
    <button class="ab ok" data-d="confirm">确认执行</button>
    <button class="ab" data-d="defer">暂不动作</button>
    <button class="ab no" data-d="reject">否决</button>
    <button class="ab" data-d="note">写备注</button></div>`;
}

let toastT=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200);
}

async function sendAudit(item,decision,note,ref){
  if(!lastRoot){ toast('隧道未连接，无法留痕'); return false; }
  try{
    const r=await fetch(lastRoot+'/api/confirm',{method:'POST',cache:'no-store',
      headers:{'X-FH-Key':getKey(),'Content-Type':'application/json'},
      body:JSON.stringify({item:item,decision:decision,note:note||'',ref:ref||''})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast('已留痕');
    await load();
    return true;
  }catch(e){ toast('留痕失败：'+e.message); return false; }
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest?ev.target.closest('.ab'):null;
  if(!b) return;
  const box=b.closest('.acts');
  const item=box.dataset.item, ref=box.dataset.ref||'', d=b.dataset.d;
  if(d==='note'){
    const t=window.prompt('备注（会随留痕存进 VPS）');
    if(t&&t.trim()) sendAudit(item,'note',t.trim(),ref);
    return;
  }
  sendAudit(item,d,'',ref);
});

document.addEventListener('click',ev=>{
  const kb=ev.target.closest?ev.target.closest('#kbtn'):null;
  if(!kb) return;
  const el=pick('#kin'), v=(el&&el.value||'').trim();
  if(!v){ pick('#kmsg').textContent='请输入口令'; return; }
  localStorage.setItem(KEY_STORE,v);
  pick('#kmsg').textContent='验证中…';
  load();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target&&ev.target.id==='kin'){
    const kb=pick('#kbtn'); if(kb) kb.click();
  }
});

load(); setInterval(load,60000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ── 治理扩展（2026-11-03）：时效 / 国家队 / 通知 / 看板入口 ──
   复用 board.html 已生成的 board.json；不改 state.json 契约，不动原有渲染。 */
const EXTRAS_SOURCES=[
  'data/board.json',
  'https://raw.githubusercontent.com/2647805640max-lab/finhub-data/main/board.json'
];
async function loadExtras(){
  let b=null;
  for(const u of EXTRAS_SOURCES){
    try{ b=await jget(u+(u.indexOf('?')>=0?'&':'?')+'_='+Date.now()); break; }catch(e){}
  }
  const bar=document.getElementById('freshbar');
  if(!b){
    if(bar){ bar.hidden=false; bar.className='freshbar warn';
      bar.textContent='⚠ 取不到治理数据（board.json）——上方为基础层，时效未知'; }
    return;
  }
  window.__extrasData=b;
  renderExtras(b);
  if(window.GOV) window.GOV.render(b);
}
function renderExtras(b){
  /* ── 行情条（2026-11-04 新增：ingest-market 采集 → board.json.market → 这里）── */
  try{
    var marketBar=document.getElementById('marketbar');
    if(marketBar){
      var market=b&&b.market;
      if(!market||!market.sources){ marketBar.hidden=true; }
      else{
        var parts=[];
        var idx=market.sources.indices;
        if(idx&&idx.ok&&idx.value&&idx.value.items){
          idx.value.items.forEach(function(it){
            if(!it||it.price==null) return;
            var pct=(it.changePct==null)?null:it.changePct;
            var cls=pct==null?'':(pct>0?'up':(pct<0?'dn':''));
            var sign=(pct==null)?'':((pct>0?'+':'')+pct.toFixed(2)+'%');
            parts.push('<span class="mk">'+String(it.name||it.code)+' <b>'+Number(it.price).toFixed(2)+'</b> <span class="'+cls+'">'+sign+'</span></span>');
          });
        }
        var extra=[['brent','布伦特'],['gold','黄金'],['usdcny','USDCNY']];
        extra.forEach(function(pair){
          var src=market.sources[pair[0]];
          if(src&&src.ok&&src.value&&src.value.price!=null){
            parts.push('<span class="mk">'+pair[1]+' <b>'+src.value.price+'</b></span>');
          }
        });
        if(parts.length===0){ marketBar.hidden=true; }
        else{
          var misses=[];
          ['cn10y','us30y'].forEach(function(k){
            var s=market.sources[k];
            if(s&&!s.ok) misses.push(k==='cn10y'?'中10Y':'美30Y');
          });
          if(misses.length>0){ parts.push('<span class="mk dim" style="opacity:.6">缺：'+misses.join('/')+'</span>'); }
          marketBar.hidden=false;
          marketBar.innerHTML=parts.join('');
          marketBar.title='行情时点 '+(market.generatedAt||'未知');
        }
      }
    }
  }catch(marketErr){ /* 行情失败不影响主内容 */ }
  /* ── 自动化状态（Harness 定时任务，单向耦合，2026-11-03）── */
  try{
    var autoBar=document.getElementById('autobar');
    if(autoBar){
      var automation=b&&b.automation;
      if(!automation){ autoBar.hidden=true; }
      else{
        var st=(automation.health&&automation.health.status)||'unknown';
        var tone=(st==='healthy')?'ok':((st==='failing'||st==='degraded')?'bad':'warn');
        var labelMap={healthy:'正常',warning:'有警告',degraded:'降级',failing:'失败','never-ran':'从未运行','not-configured':'未配置',unknown:'未知'};
        var labelText=labelMap[st]||st;
        var parts=['⚙ 自动化 '+labelText];
        if(automation.stats){ parts.push('近'+automation.stats.total+'次 OK'+automation.stats.ok+'/WARN'+automation.stats.warn+'/FAIL'+automation.stats.fail); }
        var sched=(automation.schedules&&automation.schedules[0])||null;
        if(sched&&sched.nextRunAt){ parts.push('下次 '+String(sched.nextRunAt).slice(11,16)); }
        if(sched&&sched.everySeconds){ parts.push('每 '+(sched.everySeconds/60)+' 分钟'); }
        autoBar.hidden=false;
        autoBar.className='freshbar '+tone;
        autoBar.textContent=parts.join(' · ');
        if(automation.health&&automation.health.reason){ autoBar.title=automation.health.reason; }
      }
    }
  }catch(autoRenderErr){ /* 自动化状态失败不影响主内容 */ }
  const bar=document.getElementById('freshbar');
  const f=b._freshness;
  if(bar){
    bar.hidden=false;
    if(!f){ bar.className='freshbar warn'; bar.textContent='⚠ 无时效信息（数据可能过期）'; }
    else{
      bar.className='freshbar '+(f.worst==='critical'?'bad':(f.worst==='stale'?'warn':'ok'));
      const h=(f.items||[]).find(x=>x.id==='holdings');
      let t=(f.worst==='critical'?'⚠ ':(f.worst==='stale'?'△ ':'✓ '))+f.banner;
      if(h&&h.asOf) t+='　（持仓 '+h.asOf+(h.ageDays!=null?' / '+h.ageDays+'天':'')+'）';
      bar.textContent=t;
    }
  }
  const app=document.getElementById('app');
  if(!app) return;
  let x='';
  const n=b.nationalTeam;
  if(n){
    if(!n.ok){ x+='<div class="xcard"><h3>国家队动向</h3><div class="xnote" style="color:#ff5c5c">拉取失败：'+(n.error||'未知')+'（失败时不显示旧数）</div></div>'; }
    else{
      const s=n.summary||{}, it=n.items||[];
      x+='<div class="xcard"><h3>国家队动向 · F2-补</h3>'
       +'<div class="xnote">采集 '+(n.lastSuccess||'—')+' ｜ 区间 '+(n.datePrev||'—')+' → '+(n.dateCurrent||'—')
       +' ｜ 共 '+(s.total||0)+' 只（增 '+(s.up||0)+' / 减 '+(s.down||0)+' / 平 '+(s.flat||0)+'）</div>'
       +'<table class="nttbl"><tbody>'+it.map(function(v){
          return '<tr><td>'+v.name+'<div class="xnote" style="margin:0;font-size:10px">'+v.code+'</div></td>'
            +'<td class="r" style="color:'+(v.deltaShares>0?'#3ddc97':'#ff5c5c')+'">'+(v.deltaWan>0?'+':'')+v.deltaWan+' 万份</td>'
            +'<td class="r">'+(v.deltaPct>0?'+':'')+v.deltaPct+'%</td></tr>';
        }).join('')+'</tbody></table>'
       +'<div class="xnote">'+(n.discipline||'')+'</div></div>';
    }
  }
  const q=b.notifications;
  if(q&&q.items&&q.items.length){
    x+='<div class="xcard"><h3>通知 · '+(q.count||0)+' 条</h3>'
     +q.items.map(function(v){
        const c=v.level==='urgent'?'#ff5c5c':(v.level==='watch'?'#ffb340':'#7c8899');
        return '<div style="margin-bottom:8px"><span style="color:'+c+';font-size:11px">['+v.level+']</span> <b>'+v.title+'</b>'
          +'<div class="xnote" style="margin-top:2px">'+(v.body||'')+'</div></div>';
      }).join('')
     +'<button class="xbtn" onclick="askNotify()">开启系统通知</button>'
     +'<div class="xnote" id="notifyState"></div></div>';
  }
  x+='<div class="xcard"><h3>治理看板</h3>'
   +'<div class="xnote">配置仪表 / 因子信号 / 新闻事件 / 推演假设 / 观察清单 / 审计留痕</div>'
   +'<a class="xbtn" href="board.html">打开治理看板 →</a></div>';
  app.innerHTML+=x;
}
function askNotify(){
  const el=document.getElementById('notifyState');
  if(!('Notification' in window)){ if(el) el.textContent='本环境不支持通知 API'; return; }
  Notification.requestPermission().then(function(p){
    if(el) el.textContent='通知权限：'+p;
    if(p==='granted'){
      const q=(window.__extrasData||{}).notifications||{};
      ((q.items)||[]).filter(function(v){return v.level==='urgent'}).forEach(function(v,i){
        setTimeout(function(){ try{ new Notification('【紧急】'+v.title,{body:v.body,tag:v.id}); }catch(e){} }, i*800);
      });
    }
  });
}

<script>
(function(){
"use strict";

const govQuery = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(title, tag, body){ return `<div class="card"><h2>${esc(title)}<span class="tag">${esc(tag||'')}</span></h2>${body}</div>`; }

// ── IPS 五项 ──
function renderIPS(d){
  const ips = d.ips || {};
  const rows = (ips.items||[]).map(it=>{
    const cls = it.status==='ok'?'ok':(it.status==='gap'?'bad':'warn');
    return `<tr><td><b>${esc(it.name)}</b><div class="dim" style="font-size:11px">${esc(it.source||'')}</div></td>
      <td class="num">${esc(it.value==null?'—':it.value)}</td>
      <td class="${cls}" style="font-size:11px">${esc(it.note||'')}</td></tr>`;
  }).join('');
  let h = card('IPS 一页速查', ips.asOf||'', `

function renderFactor(d){

  items.forEach(x=>{ const k=(x.kind==='exposure' ? (x.variant||'exposure') : 'predictive'); grp[k]=(grp[k]||0)+1; });
  let h = card('因子总数（不可相加）', f.asOf||'', `<div class="kv">
    <div>暴露·资产类别</div><div><b>${grp['asset-class']||0}</b> 个</div>

    <div>说明</div><div class="dim">${esc(sum.note||'三类因子含义不同，不可相加')}</div></div>`);
  const tbody = items.map(x=>{
    // board.json 里 correlations 可能是数组，也可能是 {}（空对象）；非数组一律当空处理。

    const cs = corrList.filter(c=>c && c.r!=null && Math.abs(Number(c.r))>=0.7);
    const cTxt = cs.length ? cs.map(c=>`${esc(c.with)} ${Number(c.r)>0?'+':''}${Number(c.r).toFixed(3)}`).join(' · ') : '<span class="dim">—</span>';
    return `<tr><td><b>${esc(x.id)}</b><div class="dim" style="font-size:11px">${esc(x.label||'')}</div></td>

      <td style="font-size:11px">${cTxt}</td>
      <td style="font-size:11px" class="dim">${esc(x.invalidation||'—')}</td></tr>`;
  }).join('');
  h += card('因子清单', items.length+' 条', `<table><thead><tr><th>id</th><th>类</th><th>方向/频率</th><th>|r|≥0.7</th><th>失效条件</th></tr></thead>

    h += card('未知项', String(f.unknowns.length), f.unknowns.map(u=>`<div class="dim" style="font-size:12px">· ${esc(u)}</div>`).join(''));

}

function askNotify(){
  const el=document.getElementById('notifyState');
  if(!('Notification' in window)){ if(el) el.textContent='本环境不支持通知 API'; return; }
  Notification.requestPermission().then(p=>{
    if(el) el.textContent = '通知权限：'+p;
    if(p==='granted'){
      const q=(window.__boardData||{}).notifications||{};
      const urgent=(Array.isArray(q.items)?q.items:[]).filter(x=>x.level==='urgent');
      urgent.forEach((x,i)=>setTimeout(()=>{ try{ new Notification('【紧急】'+x.title,{body:x.body,tag:x.id}); }catch(e){} }, i*800));
    }
  });
}

// 三源降级（2026-11-04 轻量化后源序：finhub-data raw 优先 → localStorage 上次成功数据）
//   1) raw.githubusercontent.com 公开数据仓 —— S4 每 30 分钟覆盖（最多 ~5 分钟 CDN 时差）
//   2) ./data/board.json   Pages 自托管兜底（2026-11-04 起 S4 不再往 finhub 仓推 board.json，
//                          该文件会逐渐变旧，仅作 Pages 自托管可用性兜底）
//   3) localStorage 上次成功数据（离线可读）
// 全部失败 → 显示错误 + 「上次成功时间」，绝不显示成 0 或空成功。
const BOARD_SOURCE_RAW   = 'https://raw.githubusercontent.com/2647805640max-lab/finhub-data/main/board.json';
const BOARD_SOURCE_SELF  = './data/board.json';
const BOARD_CACHE_KEY    = 'board.cache.v1';
const BOARD_CACHE_META   = 'board.cache.meta.v1';

function readCache(){
  try{
    const rawTxt = localStorage.getItem(BOARD_CACHE_KEY);
    if(!rawTxt) return null;
    const parsed = JSON.parse(rawTxt);
    if(!parsed || !parsed.schema) return null;
    let meta = null;
    try{ meta = JSON.parse(localStorage.getItem(BOARD_CACHE_META) || 'null'); }catch(e){ meta = null; }
    return { d: parsed, src: (meta && meta.src) || 'localStorage 缓存', cachedAt: (meta && meta.at) || null };
  }catch(e){ return null; }
}
function writeCache(d, src){
  try{
    localStorage.setItem(BOARD_CACHE_KEY, JSON.stringify(d));
    localStorage.setItem(BOARD_CACHE_META, JSON.stringify({ src: src, at: new Date().toISOString(), generatedAt: d.generatedAt || null }));
  }catch(e){ /* 配额满/隐私模式：静默降级，不影响在线取数 */ }
}
function cacheMetaTime(){
  try{
    const meta = JSON.parse(localStorage.getItem(BOARD_CACHE_META) || 'null');
    if(meta && meta.at) return meta.at;
  }catch(e){}
  return null;
}

async function fetchOne(url){
  const r = await fetch(url + (url.indexOf('?')>=0 ? '&' : '?') + '_=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if(!j || typeof j !== 'object') throw new Error('响应不是 JSON 对象');
  return j;
}

// 主取数：按顺序尝试 前两源；失败再落到 localStorage 缓存。
// 返回 { d, src, fromCache, lastSuccessAt, errors }
async function fetchBoard(){
  const errors = [];
  const candidates = [BOARD_SOURCE_RAW, BOARD_SOURCE_SELF];
  for (const u of candidates){
    try{
      const d = await fetchOne(u);
      writeCache(d, u);
      return { d: d, src: u, fromCache: false, lastSuccessAt: new Date().toISOString(), errors: errors };
    }catch(e){
      errors.push(u + ' → ' + (e && e.message ? e.message : String(e)));
    }
  }
  const cached = readCache();
  if(cached){
    return { d: cached.d, src: cached.src, fromCache: true,
             lastSuccessAt: cached.cachedAt || cacheMetaTime(), errors: errors };
  }
  return { d: null, src: null, fromCache: false, lastSuccessAt: cacheMetaTime(), errors: errors };
}

// ── Service Worker：board.json 离线只读缓存（stale-while-revalidate）──
// 用 Blob URL 内联注册，避免多出一个 sw.js 文件；file:// 或受限环境失败时静默降级（localStorage 兜底）。
function registerServiceWorker(){ /* 已停用：与 index-remote 的 sw.js 同 scope 冲突 */
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:') return;          // file:// 下 SW 不可用，静默跳过
  const swSource = [
    "const CACHE='board-sw-v1';",
    "self.addEventListener('install',e=>{self.skipWaiting();});",
    "self.addEventListener('activate',function(e){ e.waitUntil( caches.keys().then(function(ks){ return Promise.all( ks.filter(function(k){ return k!==CACHE; }).map(function(k){ return caches.delete(k); }) ); }).then(function(){ return self.clients.claim(); }) ); });",
    "self.addEventListener('fetch',e=>{",
    "  const req=e.request;",
    "  if(req.method!=='GET') return;",
    "  const url=new URL(req.url);",
    "  const sameOrigin=url.origin===self.location.origin;",
    "  const isBoard=sameOrigin && /(^|\\/)data\\/board\\.json(\\?|$)/.test(url.pathname+url.search);",
    "  const isRaw=url.host==='raw.githubusercontent.com' && /finhub-data\\/main\\/board\\.json/.test(url.pathname);",
    "  if(!isBoard && !isRaw) return;",
    "  e.respondWith(caches.open(CACHE).then(cache=>cache.match(req).then(hit=>{",
    "    const net=fetch(req).then(res=>{",
    "      if(res && res.ok) { const copy=res.clone(); cache.put(req,copy); }",
    "      return res;",
    "    }).catch(()=>hit);",
    "    return hit || net;",
    "  })));",
    "});"
  ].join('\n');
  try{
    const blobUrl = URL.createObjectURL(new Blob([swSource], {type:'text/javascript'}));
    navigator.serviceWorker.register(blobUrl).catch(()=>{});
  }catch(e){ /* 静默降级：localStorage 缓存已在 fetchBoard 里兜底 */ }
}

      if(parts.length<3){ errs.push({line:idx+1, text:t, reason:'列数少于 3（名称|代码|市值…）'}); return; }

    const platform=($('#hplat').value||'').trim();
    const cash=parseFloat(($('#hcash').value||'0').replace(/[,，\s]/g,''))||0;
    if(!platform){ preview('平台必填（支付宝 / 券商 / 银行理财 …）。'); return; }
    const {items,errs}=parseLines(raw, platform);
    if(!items.length){ preview('没有可提交的行。'); return; }
    preview('待提交 '+items.length+' 行'+(errs.length?(' · 有 '+errs.length+' 行错误（仍可提交正确行）'):''), items, errs, cash);
    if(!window.__fhLastRoot){ $('#hmsg').innerHTML='<div class="err">隧道不可达（实时源尚未连上）。等 load 拿到 tunnelUrl 后再试。</div>'; return; }
    if(!window.__fhKeyGet || !window.__fhKeyGet()){ $('#hmsg').innerHTML='<div class="err">先解锁（口令未设置/无效）。</div>'; return; }
    $('#hsubmit').disabled=true; $('#hmsg').innerHTML='<div class="note">提交中…</div>';
    try{
      const r=await fetch(window.__fhLastRoot+'/api/holdings',
        {method:'POST', headers:{'X-FH-Key':window.__fhKeyGet(),'Content-Type':'application/json'},
         body:JSON.stringify({date, platform, cash, items, note:''})});
      const j=await r.json().catch(()=>null);
      if(r.ok && j && j.ok){
        $('#hmsg').innerHTML='<div style="color:var(--ok)">✓ 已入 VPS ledger：'+(j.platform||platform)+' '
          +(j.date||date)+' · '+j.itemCount+' 标的 · 合计 '+j.totalCny+' 元。'
          +'PC 下一轮（≤30 分钟）自动回拉到本地 finwatch。</div>';
      }else{
        const why=(j&&j.error)?j.error:(('HTTP '+(r.status||'?')));
        $('#hmsg').innerHTML='<div class="err">提交被拒：'+why+'</div>';
        preview('', items, errs, cash);
      }
    }catch(e){
      $('#hmsg').innerHTML='<div class="err">提交失败：'+(e&&e.message?e.message:e)+'</div>';
    }finally{ $('#hsubmit').disabled=false; }
  }
  document.addEventListener('input', function(ev){
    if(ev.target && ev.target.id==='htext'){ /* 触发即时预览（不提交） */
      const {items,errs}=parseLines(ev.target.value, $('#hplat').value);
      const cash=parseFloat(($('#hcash').value||'0').replace(/[,，\s]/g,''))||0;
      preview(null, items, errs, cash);
    }
  }, true);
  document.addEventListener('click', function(ev){
    const t=ev.target;
    if(t && t.id==='hsubmit'){ ev.preventDefault(); submit(); return; }
    if(t && t.id==='hclear'){
      ev.preventDefault();
      $('#htext').value=''; $('#hpreview').innerHTML=''; $('#hmsg').textContent='';
      return;
    }
  }, true);
  /* ② 一级屏「显示更多」开关（modebar 里的小 checkbox） */
  const _t2=document.getElementById('t2show');
  if(_t2) _t2.addEventListener('change', function(){
    document.body.classList.toggle('showall', this.checked);
  });
})();


/* 深链：?page=gov / #gov 直接进治理视图（便于收藏与验证） */
(function(){
  function jumpToGov(){
    try{
      if(!/[?&]page=gov/.test(location.search) && location.hash!=='#gov') return;
      var btn=document.querySelector('#modebar button[data-page="gov"]');
      if(btn) btn.click();
    }catch(e){}
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',jumpToGov); }
  else { jumpToGov(); }
  setTimeout(jumpToGov,400);
  setTimeout(jumpToGov,1200);
})();

/* ── 实时性增强（2026-11-03）──
   1) 手机切后台时定时器会被节流；切回前台立刻补一次刷新
   2) 顶部「更新 <时间>」后面持续显示「数据 N 分钟前」，让过期看得见
   3) 页面隐藏时降频（10 分钟一次），省电
*/
(function(){
  var lastFetchAt = Date.now();
  var idleTimer = null;

  function refreshNow(){
    try{
      if (typeof load === 'function') { load(); }
      lastFetchAt = Date.now();
    }catch(refreshErr){ /* 静默：下次定时还会试 */ }
    try{
      if (typeof loadExtras === 'function') { loadExtras(); }
    }catch(extrasErr){ /* 同上 */ }
  }

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      var ageMs = Date.now() - lastFetchAt;
      if (ageMs > 60000) { refreshNow(); }
      if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
    } else {
      if (!idleTimer) { idleTimer = setInterval(refreshNow, 600000); }
    }
  });

  function humanAge(minutes){
    if (minutes < 1) { return '刚刚'; }
    if (minutes < 60) { return Math.floor(minutes) + ' 分钟前'; }
    var h = Math.floor(minutes / 60);
    if (h < 24) { return h + ' 小时' + Math.floor(minutes % 60) + ' 分前'; }
    return Math.floor(h / 24) + ' 天前';
  }

  function tickAgeLabel(){
    var genEl = document.getElementById('gen');
    if (!genEl) { return; }
    var d = window.__extrasData || (window.__boardData || null);
    var stamp = d && (d.generatedAt || (d._freshness && d._freshness.checkedAt) || null);
    if (!stamp) { return; }
    var parsed = null;
    try{
      var normalized = String(stamp).replace('T', ' ').replace(/[+-]\d{2}:\d{2}$/, '');
      parsed = new Date(normalized.replace(' ', 'T'));
    }catch(parseErr){ return; }
    if (!parsed || isNaN(parsed.getTime())) { return; }
    var minutes = (Date.now() - parsed.getTime()) / 60000;
    if (minutes < 0) { return; }
    // 去掉上一轮追加的后缀，避免叠加
    var base = genEl.textContent.replace(/\s*·\s*数据\s.*$/, '');
    var color = minutes > 60 ? '#ff5c5c' : (minutes > 15 ? '#ffb340' : '#5a6675');
    genEl.innerHTML = '';
    genEl.appendChild(document.createTextNode(base));
    var span = document.createElement('span');
    span.style.color = color;
    span.textContent = ' · 数据 ' + humanAge(minutes);
    genEl.appendChild(span);
  }

  setInterval(tickAgeLabel, 30000);
  setTimeout(tickAgeLabel, 2500);
  setTimeout(tickAgeLabel, 6000);
  window.addEventListener('online', refreshNow);
})();
</script>
</body>
